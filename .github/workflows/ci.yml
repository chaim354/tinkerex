name: CI

on:
  pull_request:
    # A CLOSED SET: everything runs CI except the three classes below. This USED to be an
    # allowlist of thirteen paths while the comment above it described a denylist, and the gap
    # between the two silently disabled guards. `bin/ci test` reads far more of this tree than the
    # allowlist named — deploy_hygiene_test.rb reads `.dockerignore` (the §14c.1 guard keeping the
    # GPL sidecar trees out of the permissive Rails image, a §9 hard constraint) and
    # `sidecar/*/{Dockerfile,catalog/catalog.json}`; ci_hygiene_test.rb globs EVERY workflow, not
    # just this one; the lint gate reads `.rubocop.yml`; deploy_hygiene_test.rb reads all five
    # `.kamal/secrets*`. Counted: TWENTY files a bin/ci gate opens matched no entry, so a PR
    # touching only one of them ran ZERO jobs. It has happened: 69742ac changed `build-app.yml` +
    # CLAUDE.md — a PR *about* hosted-vs-self-hosted runners — and skipped the test that forbids
    # hosted runners. e866bfc and 932eb91 are the same shape.
    #
    # DRIFT WAS ONE-DIRECTIONAL AND SILENT: a new top-level path defaulted to NOT running CI, and
    # nothing anywhere said so. A `push: main` leg used to be the net that surfaced it as red on
    # main AFTER the merge; that leg is GONE (see below), so this filter is now the only thing
    # deciding whether a change is tested at all — and test/ci_hygiene_test.rb pins it in both
    # directions against real files, which is the net that replaced it.
    # Closing the class, rather than enumerating the instances, is
    # the same argument ci_hygiene_test.rb:44-52 makes for the self-hosted-label check and
    # deploy_hygiene_test.rb makes for the licence sweep.
    #
    # ORDER IS LOAD-BEARING WHENEVER A POSITIVE PATTERN FOLLOWS A NEGATION — GitHub evaluates these
    # top to bottom and the LAST match wins, so any future re-include (the way `client/maker-app/**`
    # once re-opened `!client/**` for the desktop app's own JS sources, before that app moved to
    # chaim354/tinkerex-client and the re-include went with it — see
    # docs/superpowers/plans/2026-08-20-stage-1-extract-client.md) MUST sit after the negation it
    # reopens, or the files it exists for silently stop triggering CI again. `paths` and
    # `paths-ignore` cannot both appear on one event, which is why the negations live inside `paths`.
    #
    # THE TWO DOT LINES ARE INSURANCE, NOT DECORATION. GitHub documents `**` as "matches all
    # characters, including /", which implies it also matches a leading dot — but that is an
    # argument, and the only probe would be merging a PR to watch what fires. Every file this
    # rewrite exists for lives at a root-level dot path (`.dockerignore`, `.rubocop.yml`,
    # `.github/**`, `.kamal/**`), so they are named as a CLASS: `.*` for root dotfiles and `.*/**`
    # for root dot-directories. They cost nothing if `**` already covered them.
    #
    # Excluded, and why each is safe: `docs/**` and `**.md` are prose no gate executes.
    # `!client/**` is kept even though `client/` no longer exists in this repo at all (it moved to
    # chaim354/tinkerex-client) — removing the line changes nothing this filter matches and only
    # grows the diff; deleting it is a future cleanup, not a correctness fix.
    #
    # COST, MEASURED over 835 non-merge commits since 2026-05-01: 327 skipped CI under the old
    # allowlist, 275 still skip, so 52 newly run. On the free self-hosted mac, serialized by the
    # concurrency group below. Dependabot's `github-actions` PRs now run the full job set — that
    # is the point, not a side effect.
    paths:
      - '**'
      - '.*'
      - '.*/**'
      - '!docs/**'
      - '!client/**'
      - '!**.md'
      # RE-INCLUDED AFTER THE NEGATIONS, WHICH IS THE ONLY PLACE THEY WORK — last match wins, so
      # moving either line above `!**.md` (or above `!docs/**`, for the second) silently stops
      # them triggering again. That is the ordering rule the block above already states.
      #
      # THESE TWO ARE PROSE THAT A GATE READS, WHICH IS WHY THEY ARE NOT PROSE FOR THIS FILTER'S
      # PURPOSES. `test/docs_hygiene_test.rb` opens CLAUDE.md for its line ceiling and globs
      # docs/invariants for the stub<->file pairing, so a PR touching ONLY those files was the one
      # PR that gate could never run on — it could not fire on the change it exists to police.
      # tinkerex#164. The skip list in test/ci_hygiene_test.rb calls itself "prose no gate
      # executes"; by its own criterion these never belonged in it.
      - 'CLAUDE.md'
      - 'docs/invariants/**'
      # AND THE ENVIRONMENT REFERENCE, FOR THE SAME REASON: test/install_docs_test.rb checks every
      # variable the code reads against docs/INSTALL.md, so a PR editing only the doc is a PR that
      # gate exists to police. Below the negations, like the two above it.
      - 'docs/INSTALL.md'
  # NO `push:` TRIGGER, AND THE ARGUMENT IS A PROBE RATHER THAN AN ASSUMPTION.
  #
  # A `pull_request` run does NOT test the branch tip — `actions/checkout` resolves
  # `github.ref` to `refs/pull/<n>/merge`, the branch ALREADY MERGED INTO main. Verified on run
  # 32883429503 (PR #245), which fetched `+7f8e0c54…:refs/remotes/pull/245/merge` and then
  # `git checkout --force refs/remotes/pull/245/merge`. So the tree a PR run exercises is the tree
  # the merge produces, and a `push: main` run afterwards re-tests what was just tested.
  #
  # MEASURED COST OF NOT KNOWING THAT: the last 40 CI runs were an exact 20/20 push/pull_request
  # split — every change paid for CI twice, at a ~175s median, on a runner that IS the developer's
  # own Mac (§15). Roughly six minutes of the dev box per change for one tree's worth of answer.
  #
  # THE RESIDUAL RISK, NAMED RATHER THAN WAVED AWAY: if `main` advances between a PR's last run
  # and its merge, the merge ref that was tested is not the `main` that results. §15 already
  # forbids pushing to `main` directly, so that can only happen when a SECOND PR merges in the
  # window — and the next PR's own merge-ref run tests the combined tree. The failure mode is
  # "main is briefly unverified", not "main is silently broken". If this repo ever gains
  # concurrent contributors, turn on "require branches to be up to date" (needs a paid plan for a
  # private repo) or restore a `push: main` leg here.
  #
  # workflow_dispatch stays so a run can still be forced by hand without a PR.
  workflow_dispatch: {}

# One run per ref at a time (a newer run cancels the older). The fleet is FOUR runners since CI
# moved to the Unraid box, so the jobs WITHIN a run are 4-wide; this only stops two runs of the same
# ref overlapping. It said "the single self-hosted runner" while that was true.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# EVERY JOB HERE RUNS ON linux — four container runners on the Unraid Docker host (192.168.1.146),
# built from ci/runner/Dockerfile and deployed as the Portainer stack ops/ci-runner-stack.yml.
# Verified 2026-08-31: `tinkerex-unraid-1..4` online, labels `self-hosted,linux,X64,maker-unraid`.
#
# UNTIL THEN CI RAN ON A DEVELOPER'S OWN MacBook, ONE JOB AT A TIME. That is why the seven jobs below
# used to be serial and are now 4-wide, and it is also why two long comments in test/ — on
# Capybara's wait budget and on WorkerBudget — were written around a CI job colliding with a local
# `bin/ci` on one machine. Read those with the move in mind.
#
# THE MOVE RAISED COVERAGE RATHER THAN LOWERING IT, which is the opposite of what changing OS
# usually does: `stl-thumbnailer` was ABSENT on the Mac runner, so Maker::Previews::Stl rendered
# `unsupported` and the STL preview path had never once run in CI — ci/ensure-resvg.sh's "green
# about less than you think", silently, for a different binary than that script watches. The image
# bakes it in alongside vipsthumbnail, resvg and pdfium, all four verified on PATH as the non-root
# runner user. **Suite counts therefore differ from the Mac's history by design**; what must still
# match is the three backend legs against EACH OTHER (CLAUDE.md §15).
#
# Deliberately NO test/file counts here. This file cannot be the place a count lives: the numbers
# move every time a test lands, and docs/STATUS.md is where per-suite figures are recorded. A count
# written in two places is a count that will be wrong in one of them — the same reason a stale
# `fs-provider` figure was deleted from CLAUDE.md rather than updated.
#
# NO `ruby/setup-ruby` ANYWHERE BELOW, AND IT IS NOW A CHOICE RATHER THAN A CONSTRAINT. It assumed
# the GitHub-hosted /Users/runner layout the self-hosted Mac did not have, and test/ci_hygiene_test.rb
# still forbids it on any job it cannot prove is off that Mac — but a `linux` job satisfies that
# exemption, so the guard would PERMIT it here. It stays out because ci/runner/Dockerfile bakes mise
# ruby 3.4.7, exactly .ruby-version, so `bundle install --quiet` is all a job needs and no job spends
# time re-fetching a Ruby it already has.
#
# EVERY JOB INVOKES `bin/ci <gate>` and never a bare command. config/ci.rb is the single definition
# of what each gate does; ci_hygiene_test asserts both directions of that contract.
jobs:
  # Which runner families exist for this run — see ci/preflight.sh for why this is a DECLARATION
  # (the repo variable CI_RUNNERS) and not an API call.
  #
  # The jobs in THIS workflow are not gated on it: they all run on LINUX, which is the family this
  # job itself runs on, so if the Unraid fleet were absent this job could not start either and
  # gating them on it would be circular. test/ci_hygiene_test.rb DERIVES that exemption from this
  # job's own `runs-on` rather than naming a family — it read the literal `macos` for as long as
  # preflight ran there, which was the consequence rather than the rule.
  #
  # So what this job buys here is entirely the SUMMARY — a run that states, on its own page, that
  # this repo's coverage stops at linux and where the rest went. Keep it: the moment a macos or
  # windows job returns it MUST be gated, and the guard enforces that. The siblings carry their own
  # copies (a workflow file's job outputs don't cross files) and gate real jobs on it.
  #
  # EVERY JOB BELOW CARRIES `if: head.repo.full_name == github.repository`. The runners are
  # self-hosted containers on the LAN (ops/ci-runner-stack.yml: SYS_PTRACE, seccomp unconfined)
  # and bin/ci runs the branch's own code, so a pull request from a FORK is code execution on
  # the LAN by whoever opened it. Harmless while the repo is private (no fork can exist) and the
  # thing that matters the day it is public. GitHub's own "require approval for all outside
  # collaborators" setting is the other half; it cannot be set on a private repo, so flipping the
  # repo public and setting it are ONE step (docs/AUDIT-2026-10-12-readiness.md, the going-public
  # checklist). Pinned on every job by test/ci_hygiene_test.rb.
  preflight:
    runs-on: [self-hosted, linux]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}  # never a fork -- see the note above preflight
    outputs:
      macos:   ${{ steps.p.outputs.macos }}
      linux:   ${{ steps.p.outputs.linux }}
      windows: ${{ steps.p.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        name: Resolve the declared runner fleet
        env:
          CI_RUNNERS: ${{ vars.CI_RUNNERS }}
        run: ci/preflight.sh | tee -a "$GITHUB_OUTPUT"
      - name: Report what is available, and what was therefore skipped
        env:
          CI_RUNNERS: ${{ vars.CI_RUNNERS }}
        run: ci/preflight.sh --summary >> "$GITHUB_STEP_SUMMARY"

  # All three security scanners in ONE job, because they are one gate. They used to be two jobs
  # running brakeman then bundler-audit in sequence; brakeman exited 3 for weeks, so the job stopped
  # at step 1 and the audit gate NEVER RAN. `bin/ci scan` uses CI.step, which records a result and
  # continues, so all three report whatever any one of them does.
  scan:
    runs-on: [self-hosted, linux]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}  # never a fork -- see the note above preflight
    steps:
      - uses: actions/checkout@v7
      - name: Install gems (the runner's own Ruby — see ci/runners/README.md)
        run: bundle install --quiet
      - name: Security scanners (gems, importmap, brakeman)
        run: bin/ci scan

  lint:
    runs-on: [self-hosted, linux]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}  # never a fork -- see the note above preflight
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@v7
      - name: Install gems (the runner's own Ruby — see ci/runners/README.md)
        run: bundle install --quiet
      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-
      - name: Lint code for consistent style
        run: bin/ci style

  test:
    runs-on: [self-hosted, linux]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}  # never a fork -- see the note above preflight
    steps:
      - uses: actions/checkout@v7
      - name: Install gems (the runner's own Ruby — see ci/runners/README.md)
        run: bundle install --quiet
      - name: Ensure resvg (SVG→PNG for the preview tests)
        run: ci/ensure-resvg.sh
      - name: Run the suite (share backend — the hermetic default since embedded chunk was retired)
        env:
          RAILS_ENV: test
        run: bin/ci test
  test-s3-backend:
    runs-on: [self-hosted, linux]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}  # never a fork -- see the note above preflight
    steps:
      - uses: actions/checkout@v7
      - name: Install gems (the runner's own Ruby — see ci/runners/README.md)
        run: bundle install --quiet
      - name: Ensure resvg (SVG→PNG for the preview tests)
        run: ci/ensure-resvg.sh
      - name: Run the suite (s3 backend)
        env:
          RAILS_ENV: test
        run: bin/ci test-s3
  test-chunk-remote:
    runs-on: [self-hosted, linux]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}  # never a fork -- see the note above preflight
    steps:
      - uses: actions/checkout@v7
      - name: Check out tinkerex-sync
        uses: actions/checkout@v7
        with:
          repository: chaim354/tinkerex-sync
          ssh-key: ${{ secrets.TINKEREX_SYNC_DEPLOY_KEY }}
          path: tinkerex-sync
      - name: Install gems (the runner's own Ruby — see ci/runners/README.md)
        run: bundle install --quiet
      - name: Run the chunk_remote journey against a real sync server
        env:
          RAILS_ENV: test
          TINKEREX_SYNC_DIR: ${{ github.workspace }}/tinkerex-sync
          SYNC_PORT: "3002"
        run: bin/ci test-chunk-remote

  system-test:
    runs-on: [self-hosted, linux]
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}  # never a fork -- see the note above preflight
    steps:
      - uses: actions/checkout@v7
      - name: Install gems (the runner's own Ruby — see ci/runners/README.md)
        run: bundle install --quiet
      - name: Run the system tests
        env:
          RAILS_ENV: test
        run: bin/ci system
      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
