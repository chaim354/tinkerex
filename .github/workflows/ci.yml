name: CI

on:
  pull_request:
    # Rails app only — skip on docs-only or client/** (Rust) changes (those gate via rust-client.yml).
    paths:
      - 'app/**'
      - 'config/**'
      - 'db/**'
      - 'lib/**'
      - 'test/**'
      - 'bin/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - '.ruby-version'
      - '.github/workflows/ci.yml'
  push:
    branches: [ main ]

# Serialize runs on the single self-hosted runners (a newer run cancels the older for the ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan_ruby:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: [self-hosted, linux]
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: [self-hosted, linux]

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  # The whole suite, run again with the share backend selected.
  #
  # This is NOT what stops the two adapters diverging — the shared adapter contract already does
  # that, and it runs against BOTH in the `test:` job above (chunk_test.rb and share_test.rb each
  # include FileLayerAdapterContract and construct their adapter explicitly, so they need no ENV).
  #
  # What this leg catches is narrower and otherwise invisible: tests that silently depend on the
  # AMBIENT backend. It earned its place immediately — it found nine of them (seven preview-job
  # tests, the maker file-bytes shim, and a previews API test), all building chunk-shaped fixtures
  # while taking their adapter from the environment, including one whose name claimed an adapter
  # it never pinned. Those are now pinned; this leg is what keeps the habit from creeping back.
  #
  # Cheap enough to justify running everything rather than a scoped subset: a tmpdir, no external
  # services. A subset would be redundant with `test:` — the point is the ambient ENV, not the
  # specific files.
  test-share-backend:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests with LIBRARY_BACKEND=share
        env:
          RAILS_ENV: test
          LIBRARY_BACKEND: share
        run: |
          export LIBRARY_PATH=$(mktemp -d)
          bin/rails db:test:prepare test

  # The whole suite again with the s3 backend selected — the sibling of test-share-backend, and it
  # buys the same narrow thing for the same reason: it catches tests that silently depend on the
  # AMBIENT backend.
  #
  # This is NOT what stops the adapters diverging. Both shared contracts already do that, and they
  # run against FileLayer::S3 in the `test:` job above (s3_test.rb includes FileLayerAdapterContract
  # AND FileLayerWritableContract, constructing its adapter explicitly with an injected stub client,
  # so it needs no ENV) — S3 inheriting the write contract is the whole point of Phase 3. The
  # headline E2E (test/integration/library/s3_library_test.rb) likewise pins its own adapter.
  #
  # HONEST RESULT, unlike the share leg's: this one found ZERO ambient-dependent tests on the way
  # in — all three legs report an identical 866/2549/0. The share leg earned its place immediately
  # by finding nine; this one is a regression guard from birth rather than a bug-finder, which is
  # the outcome to expect once the habit it enforces is already established. It stays because the
  # cost is a tmpdir-free run with no external services, and because "nothing depends on the
  # ambient backend" is exactly the kind of claim that decays silently without a leg asserting it.
  #
  # NO EXTERNAL SERVICE, deliberately: spec §7 gives S3 a stubbed client, and LibraryBackendCheck's
  # s3 leg is config-PRESENCE only and never touches the network (boot must not depend on a third
  # party being reachable). So these knobs point at nothing real on purpose — the bucket does not
  # exist and the credentials are not credentials. Any test that made a real S3 call would fail
  # here, which is a feature.
  test-s3-backend:
    runs-on: [self-hosted, linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests with LIBRARY_BACKEND=s3
        env:
          RAILS_ENV: test
          LIBRARY_BACKEND: s3
          LIBRARY_S3_BUCKET: ci-not-a-real-bucket
          LIBRARY_S3_REGION: us-east-1
          LIBRARY_S3_ACCESS_KEY_ID: ci
          LIBRARY_S3_SECRET_ACCESS_KEY: ci
          LIBRARY_S3_PREFIX: library
        run: bin/rails db:test:prepare test

  system-test:
    runs-on: [self-hosted, linux]

    # services:
    #  redis:
    #    image: valkey/valkey:8
    #    ports:
    #      - 6379:6379
    #    options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
