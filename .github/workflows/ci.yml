name: CI

on:
  pull_request:
    # A CLOSED SET: everything runs CI except the three classes below. This USED to be an
    # allowlist of thirteen paths while the comment above it described a denylist, and the gap
    # between the two silently disabled guards. `bin/ci test` reads far more of this tree than the
    # allowlist named — deploy_hygiene_test.rb reads `.dockerignore` (the §14c.1 guard keeping the
    # GPL sidecar trees out of the permissive Rails image, a §9 hard constraint) and
    # `sidecar/*/{Dockerfile,catalog/catalog.json}`; ci_hygiene_test.rb globs EVERY workflow, not
    # just this one; the lint gate reads `.rubocop.yml`; deploy_hygiene_test.rb reads all five
    # `.kamal/secrets*`. Counted: TWENTY files a bin/ci gate opens matched no entry, so a PR
    # touching only one of them ran ZERO jobs. It has happened: 69742ac changed `build-app.yml` +
    # CLAUDE.md — a PR *about* hosted-vs-self-hosted runners — and skipped the test that forbids
    # hosted runners. e866bfc and 932eb91 are the same shape.
    #
    # DRIFT WAS ONE-DIRECTIONAL AND SILENT: a new top-level path defaulted to NOT running CI, and
    # nothing anywhere said so. The `push: main` leg below is unfiltered, so the failure surfaced
    # as red on main AFTER the merge. Closing the class, rather than enumerating the instances, is
    # the same argument ci_hygiene_test.rb:44-52 makes for the self-hosted-label check and
    # deploy_hygiene_test.rb makes for the licence sweep.
    #
    # ORDER IS LOAD-BEARING WHENEVER A POSITIVE PATTERN FOLLOWS A NEGATION — GitHub evaluates these
    # top to bottom and the LAST match wins, so any future re-include (the way `client/maker-app/**`
    # once re-opened `!client/**` for the desktop app's own JS sources, before that app moved to
    # chaim354/tinkerex-client and the re-include went with it — see
    # docs/superpowers/plans/2026-08-20-stage-1-extract-client.md) MUST sit after the negation it
    # reopens, or the files it exists for silently stop triggering CI again. `paths` and
    # `paths-ignore` cannot both appear on one event, which is why the negations live inside `paths`.
    #
    # THE TWO DOT LINES ARE INSURANCE, NOT DECORATION. GitHub documents `**` as "matches all
    # characters, including /", which implies it also matches a leading dot — but that is an
    # argument, and the only probe would be merging a PR to watch what fires. Every file this
    # rewrite exists for lives at a root-level dot path (`.dockerignore`, `.rubocop.yml`,
    # `.github/**`, `.kamal/**`), so they are named as a CLASS: `.*` for root dotfiles and `.*/**`
    # for root dot-directories. They cost nothing if `**` already covered them.
    #
    # Excluded, and why each is safe: `docs/**` and `**.md` are prose no gate executes.
    # `!client/**` is kept even though `client/` no longer exists in this repo at all (it moved to
    # chaim354/tinkerex-client) — removing the line changes nothing this filter matches and only
    # grows the diff; deleting it is a future cleanup, not a correctness fix.
    #
    # COST, MEASURED over 835 non-merge commits since 2026-05-01: 327 skipped CI under the old
    # allowlist, 275 still skip, so 52 newly run. On the free self-hosted mac, serialized by the
    # concurrency group below. Dependabot's `github-actions` PRs now run the full job set — that
    # is the point, not a side effect.
    paths:
      - '**'
      - '.*'
      - '.*/**'
      - '!docs/**'
      - '!client/**'
      - '!**.md'
  push:
    branches: [ main ]

# Serialize runs on the single self-hosted runner (a newer run cancels the older for the ref).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# EVERY JOB HERE RUNS ON macos, and that is a measurement rather than a preference. Verified on the
# maker-mac box (2026-07-29): the suite is green with 0 failures and 0 errors on all THREE
# LIBRARY_BACKEND values, test:system is green with headless Chrome, rubocop is clean, and all three
# scanners exit 0. The serialisation worry that kept these on `linux` is measured away — the whole
# job set is well under a minute of actual work, and wall-clock is dominated by checkout and bundle.
#
# Deliberately NO test/file counts here. This file cannot be the place a count lives: the numbers
# move every time a test lands, and docs/STATUS.md is where per-suite figures are recorded. A count
# written in two places is a count that will be wrong in one of them — the same reason a stale
# `fs-provider` figure was deleted from CLAUDE.md rather than updated.
#
# NO `ruby/setup-ruby` ANYWHERE BELOW, deliberately: it assumes the GitHub-hosted /Users/runner
# layout this self-hosted Mac does not have (nightly.yml's e2e-macos already works around it). The
# runner's service PATH carries mise ruby 3.4.7 — exactly .ruby-version — so `bundle install` is
# all a job needs. test/ci_hygiene_test.rb fails if the action reappears in a macos job.
#
# EVERY JOB INVOKES `bin/ci <gate>` and never a bare command. config/ci.rb is the single definition
# of what each gate does; ci_hygiene_test asserts both directions of that contract.
jobs:
  # Which runner families exist for this run — see ci/preflight.sh for why this is a DECLARATION
  # (the repo variable CI_RUNNERS) and not an API call.
  #
  # The jobs in THIS workflow are not gated on it: they all run on macos, and if the mac runner were
  # absent this job could not start either, so gating them on it would be circular. nightly.yml and
  # client-contract.yml each carry their OWN copy of this same job (a workflow file's job outputs
  # don't cross files) and gate their linux/macos jobs on it. What this job buys ci.yml is the
  # SUMMARY — a run that states, on its own page, which coverage it did not run.
  preflight:
    runs-on: [self-hosted, macos]
    outputs:
      macos:   ${{ steps.p.outputs.macos }}
      linux:   ${{ steps.p.outputs.linux }}
      windows: ${{ steps.p.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
      - id: p
        name: Resolve the declared runner fleet
        env:
          CI_RUNNERS: ${{ vars.CI_RUNNERS }}
        run: ci/preflight.sh | tee -a "$GITHUB_OUTPUT"
      - name: Report what is available, and what was therefore skipped
        env:
          CI_RUNNERS: ${{ vars.CI_RUNNERS }}
        run: ci/preflight.sh --summary >> "$GITHUB_STEP_SUMMARY"

  # All three security scanners in ONE job, because they are one gate. They used to be two jobs
  # running brakeman then bundler-audit in sequence; brakeman exited 3 for weeks, so the job stopped
  # at step 1 and the audit gate NEVER RAN. `bin/ci scan` uses CI.step, which records a result and
  # continues, so all three report whatever any one of them does.
  scan:
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v7
      - name: Install gems (the runner's own Ruby — see ci/runners/README.md)
        run: bundle install --quiet
      - name: Security scanners (gems, importmap, brakeman)
        run: bin/ci scan

  lint:
    runs-on: [self-hosted, macos]
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - uses: actions/checkout@v7
      - name: Install gems (the runner's own Ruby — see ci/runners/README.md)
        run: bundle install --quiet
      - name: Prepare RuboCop cache
        uses: actions/cache@v6
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-
      - name: Lint code for consistent style
        run: bin/ci style

  test:
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v7
      - name: Install gems (the runner's own Ruby — see ci/runners/README.md)
        run: bundle install --quiet
      - name: Ensure resvg (SVG→PNG for the preview tests)
        run: ci/ensure-resvg.sh
      - name: Run the suite (chunk backend)
        env:
          RAILS_ENV: test
        run: bin/ci test

  # The whole suite, run again with the share backend selected.
  #
  # This is NOT what stops the two adapters diverging — the shared adapter contract already does
  # that, and it runs against BOTH in the `test:` job above (chunk_test.rb and share_test.rb each
  # include FileLayerAdapterContract and construct their adapter explicitly, so they need no ENV).
  #
  # What this leg catches is narrower and otherwise invisible: tests that silently depend on the
  # AMBIENT backend. It earned its place immediately — it found nine of them (seven preview-job
  # tests, the maker file-bytes shim, and a previews API test), all building chunk-shaped fixtures
  # while taking their adapter from the environment, including one whose name claimed an adapter
  # it never pinned. Those are now pinned; this leg is what keeps the habit from creeping back.
  #
  # WHY THE WHOLE SUITE RATHER THAN A SCOPED SUBSET: it is cheap enough to justify — a tmpdir, no
  # external services — and a subset would be redundant with `test:` above. The thing under test here
  # is the AMBIENT ENV, not any particular file, so narrowing the file list narrows nothing that
  # matters while creating a list somebody has to keep current.
  test-share-backend:
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v7
      - name: Install gems (the runner's own Ruby — see ci/runners/README.md)
        run: bundle install --quiet
      - name: Ensure resvg (SVG→PNG for the preview tests)
        run: ci/ensure-resvg.sh
      - name: Run the suite (share backend)
        env:
          RAILS_ENV: test
        run: bin/ci test-share

  # The sibling of test-share-backend, buying the same narrow thing for the same reason.
  #
  # As with the share leg, this is NOT what stops the adapters diverging: both shared contracts
  # already do that and they run in `test:` above. `test/services/file_layer/s3_test.rb` includes
  # FileLayerAdapterContract AND FileLayerWritableContract, constructing its adapter explicitly with
  # an injected stub client, so it needs no ENV — S3 inheriting the WRITE contract was the whole
  # point of the file-layer split's Phase 3. The headline E2E
  # (test/integration/library/s3_library_test.rb) likewise pins its own adapter.
  #
  # HONEST RESULT, unlike the share leg's: this one found ZERO ambient-dependent tests on the way
  # in — all three legs report an identical count. The share leg earned its place immediately by
  # finding nine; this one is a regression guard from birth, which is the outcome to expect once the
  # habit it enforces is already established. It stays because it costs a tmpdir-free run with no
  # external services, and because "nothing depends on the ambient backend" is exactly the kind of
  # claim that decays silently without a leg asserting it.
  #
  # NO EXTERNAL SERVICE, deliberately — see the comment on the `test-s3` gate in config/ci.rb.
  test-s3-backend:
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v7
      - name: Install gems (the runner's own Ruby — see ci/runners/README.md)
        run: bundle install --quiet
      - name: Ensure resvg (SVG→PNG for the preview tests)
        run: ci/ensure-resvg.sh
      - name: Run the suite (s3 backend)
        env:
          RAILS_ENV: test
        run: bin/ci test-s3

  # The browser tier. Its own job so its cost stays visible as it grows, rather than inflating the
  # unit-test job. See test/system/README.md for what earns a place in it.
  # The ONLY job where the sync engine is genuinely not in the process. The three backend jobs
  # above pin SYNC_ENGINE=1 so their counts stay identical (§15); this one is what actually executes
  # config/application.rb's conditional require. See config/ci.rb's own comment for why both exist.
  test-no-engine:
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v7
      - name: Install gems (the runner's own Ruby — see ci/runners/README.md)
        run: bundle install --quiet
      - name: Run the no-engine boot suite
        env:
          RAILS_ENV: test
        run: bin/ci test-no-engine

  # THE chunk_remote JOURNEY, AGAINST A REAL STANDALONE tinkerex-sync HOST -- config/ci.rb's
  # `test-chunk-remote` gate, which owns the whole boot/probe/run/skip-check script; see its own
  # comment there for the mechanism. This job exists only for the two things a gate cannot do for
  # itself: check out a SECOND repository, and hand it credentials.
  #
  # USED TO BE .github/workflows/sync-contract.yml, kept OUT of bin/ci while the suite was
  # deliberately red (Stage 5 Arc B measured, then closed, four real gaps -- docs/STATUS.md). Now
  # 10/10 against a real server, it moved in here rather than being left running the same suite a
  # second way -- one definition, same as every other gate.
  #
  # SECOND CHECKOUT: the sync engine is a separate private repo, and secrets.GITHUB_TOKEN is scoped
  # to THIS repo only. A READ-ONLY DEPLOY KEY, NOT A PAT -- same reasoning as §14j's Docker-build
  # key: a PAT carries the whole account's reach to read one repo, and GitHub has had no API to
  # mint one since POST /authorizations was sunset in 2020, so it is also an irreducibly manual,
  # by-hand-in-a-browser step. `gh repo deploy-key add` creates exactly the narrower thing --
  # tinkerex-sync's `ci-sync-contract` key, unchanged by the workflow's rename.
  test-chunk-remote:
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v7
      - name: Check out tinkerex-sync
        uses: actions/checkout@v7
        with:
          repository: chaim354/tinkerex-sync
          ssh-key: ${{ secrets.TINKEREX_SYNC_DEPLOY_KEY }}
          path: tinkerex-sync
      - name: Install gems (the runner's own Ruby — see ci/runners/README.md)
        run: bundle install --quiet
      - name: Run the chunk_remote journey against a real sync server
        env:
          RAILS_ENV: test
          TINKEREX_SYNC_DIR: ${{ github.workspace }}/tinkerex-sync
          SYNC_PORT: "3002"
        run: bin/ci test-chunk-remote

  system-test:
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v7
      - name: Install gems (the runner's own Ruby — see ci/runners/README.md)
        run: bundle install --quiet
      - name: Run the system tests
        env:
          RAILS_ENV: test
        run: bin/ci system
      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
