name: Nightly (heavy / cross-platform)

# The slow, cross-platform, and live jobs kept OFF the per-PR loop: full Windows builds, the live
# CfAPI smoke (needs the Windows desktop awake + the deployed server reachable), and the
# fsx/pjdfstest mount conformance. Runs overnight and on-demand — trigger it manually
# (Actions tab → "Run workflow", or `gh workflow run nightly.yml --ref <branch>`) right before a
# CfAPI change needs live proof or before flipping the Windows default (Task B5).
on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-build:
    # Build the real Windows mount adapters (fs-cfapi + fs-winfsp) + their sync-engine wiring —
    # the only place winfsp-sys (msvc-only) and the cfg(windows) daemon code actually link.
    # LLVM + WinFsp are preinstalled by ci/runners/setup-windows.ps1.
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build fs-cfapi (lib + maker-cfapi)
        run: cargo build --manifest-path client/fs-cfapi/Cargo.toml --bins
      - name: Build fs-winfsp (WinFsp adapter)
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo build --manifest-path client/fs-winfsp/Cargo.toml --bins
      - name: Build sync-engine on Windows (CfApiMount + WinfspMount + maker-cfsyncd)
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo build --manifest-path client/sync-engine/Cargo.toml --bins

  # --- Two-device END-TO-END on each OS (the headline multi-device workflow) ---------------
  # The same client stack the Tauri app runs (fs-provider tree + sync-engine loop + ServerClient
  # API), exercised as TWO independent devices paired into one library: A writes → B pulls +
  # hydrates → B edits → A pulls, byte-for-byte, plus delete/move/rename/dedup/restore/conflict.
  # This is the PROVIDER/ENGINE-LEVEL leg (headless on every OS); the kernel-mount leg is the
  # per-OS conformance suites' job (cfapi-conformance here; webdav-rclone/fsx-fuse in the
  # mount-conformance job below). The Linux job is self-contained (boots a memory Rails server);
  # mac/Windows run against the deployed server and skip cleanly if it's unreachable.

  e2e-linux:
    # Self-contained: boot STORAGE_BACKEND=memory Rails (SQLite) here, like engine-integration.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: FUSE dev headers (sync-engine pulls fs-fuse on Linux)
        run: sudo apt-get install -y libfuse-dev pkg-config
      - name: Prepare the dev database (SQLite)
        run: bin/rails db:prepare
      - name: Boot the sync server + run the two-device e2e (one step keeps the server alive)
        env:
          SYNC_IT_SERVER_URL: http://localhost:3001
        run: |
          (fuser -k 3001/tcp 2>/dev/null || pkill -f 'puma' 2>/dev/null) || true
          sleep 1
          STORAGE_BACKEND=memory bin/rails server -p 3001 &
          SRV=$!
          for i in $(seq 1 60); do curl -sf http://localhost:3001/up >/dev/null && { echo "server up"; break; }; sleep 1; done
          curl -sf http://localhost:3001/up >/dev/null || { echo "server failed to start"; kill $SRV 2>/dev/null; exit 1; }
          set +e
          cargo test --manifest-path client/sync-engine/Cargo.toml --test two_device_e2e -- --nocapture
          code=$?
          set -e
          kill $SRV 2>/dev/null || true
          exit $code

  e2e-macos:
    # macOS client stack. Self-contained: boots a STORAGE_BACKEND=memory Rails server locally
    # (the mac runner can't route to the deployed server's network segment), so it proves the
    # macOS client stack converges without depending on cross-network reachability. fuser is
    # cfg(linux), so sync-engine builds with no FUSE on mac.
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
      # Use the runner's preinstalled Ruby/bundler (the maker-mac dev box) — ruby/setup-ruby
      # assumes the GitHub-hosted /Users/runner layout this self-hosted runner doesn't have.
      - name: Boot the sync server + run the two-device e2e (one step keeps the server alive)
        env:
          SYNC_IT_SERVER_URL: http://localhost:3001
        run: |
          bundle install --quiet
          bin/rails db:prepare
          (lsof -ti tcp:3001 | xargs kill -9 2>/dev/null) || true
          sleep 1
          STORAGE_BACKEND=memory bin/rails server -p 3001 &
          SRV=$!
          for i in $(seq 1 60); do curl -sf http://localhost:3001/up >/dev/null && { echo "server up"; break; }; sleep 1; done
          curl -sf http://localhost:3001/up >/dev/null || { echo "server failed to start"; kill $SRV 2>/dev/null; exit 1; }
          set +e
          cargo test --manifest-path client/sync-engine/Cargo.toml --test two_device_e2e -- --nocapture
          code=$?
          set -e
          kill $SRV 2>/dev/null || true
          exit $code

  e2e-windows:
    # Windows client stack against the deployed server. Builds the cfg(windows) daemon path.
    # Same deployed-server target as the CfAPI conformance jobs; skips cleanly if unreachable.
    runs-on: [self-hosted, windows]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
      - name: Two-device e2e (Windows client stack vs the deployed server)
        env:
          SYNC_IT_SERVER_URL: http://192.168.1.95
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo test --manifest-path client/sync-engine/Cargo.toml --test two_device_e2e -- --nocapture

  # --- Two-device REAL-MOUNT END-TO-END (the layer ABOVE the engine-level e2e) --------------
  # These mount TWO real kernel mounts at once (the same Daemon/CfApiMount/WebdavMount the Tauri
  # app's sync_start launches), pair them into one library via the REAL pairing flow, and pass a
  # file THROUGH one mount to be read byte-for-byte THROUGH the other — plus new/nested/delete/
  # rename/multi-chunk. This is the syscall→adapter→Provider leg the engine-level e2e can't reach.
  # macOS's leg is interactive-only (mount_webdav) → a manual script the user runs locally
  # (client/test-conformance/two-device-webdav-macos.sh), NOT CI-automated.

  two-device-fuse-linux:
    # Linux FUSE CAN mount in CI when /dev/fuse is available, so this real-mount leg is automated.
    # The script self-detects a missing /dev/fuse / allow_other and exits 0 with a BLOCKED notice
    # rather than a false failure (an environment gap, documented in the script). continue-on-error
    # so a runner without /dev/fuse never reds the nightly.
    continue-on-error: true
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: System deps (FUSE + allow_other)
        run: |
          sudo apt-get install -y libfuse-dev fuse pkg-config
          echo 'user_allow_other' | sudo tee -a /etc/fuse.conf
      - name: Prepare the dev database (SQLite)
        run: bin/rails db:prepare
      - name: Two real FUSE mounts, A<->B byte-for-byte through the mounts
        run: client/test-conformance/two-device-fuse.sh

  two-device-cfapi-windows:
    # Windows CfAPI: mount TWO real Cloud Filter sync roots at once and pass files between them
    # through the mounts. Needs an INTERACTIVE login session (Session-0 service enumerates empty),
    # same caveat as the smoke/conformance — continue-on-error; passes only on the interactive
    # self-hosted Windows runner with the deployed server reachable.
    needs: windows-build
    continue-on-error: true
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
      - name: Two real CfAPI sync roots, A<->B byte-for-byte through the mounts
        shell: powershell
        env:
          SERVER_URL: http://192.168.1.95
        run: ./client/test-conformance/two-device-cfapi.ps1

  windows-smoke:
    # The LIVE CfAPI regression net (Phase 2b Task A4): register a sync root, enumerate, hydrate,
    # then create/edit/delete/rename and assert each round-trips to the deployed server.
    # continue-on-error: CfAPI needs an INTERACTIVE session; the runner-as-service (Session 0)
    # enumerates empty. It passes only when the Windows runner runs in an interactive login
    # session. Informational until then; it gates Task B5 once it can pass.
    needs: windows-build
    continue-on-error: true
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
      - name: Live CfAPI smoke (register -> enumerate -> hydrate -> new/edit/delete/rename)
        shell: powershell
        env:
          SERVER_URL: http://192.168.1.95
        run: ./client/test-conformance/cfapi-smoke.ps1

  cfapi-conformance:
    # The CfAPI analogue of `mount-conformance`: a rigorous live round-trip through the real
    # Cloud Filter mount — many files of varied sizes (incl. > chunk size → multi-chunk + dedup),
    # nested dirs, and create/edit/delete/rename churn — asserted BYTE-FOR-BYTE by hydrating every
    # file on a fresh device and comparing SHA-256s. Same interactive-session caveat as the smoke
    # (continue-on-error until the Windows runner runs in an interactive login session).
    needs: windows-build
    continue-on-error: true
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
      - name: Live CfAPI conformance (varied sizes / nested dirs / churn, byte-for-byte)
        shell: powershell
        env:
          SERVER_URL: http://192.168.1.95
        run: ./client/test-conformance/cfapi-conformance.ps1

  mount-conformance:
    # External, battle-tested suites against the real FUSE/WebDAV mounts (what JuiceFS/CephFS
    # gate on). Slow (fsx 100k ops, pjdfstest) → nightly, not per-PR.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps (FUSE, rclone, build tools, autotools)
        run: |
          sudo apt-get install -y \
            libfuse-dev fuse pkg-config build-essential \
            rclone curl git autoconf automake libtool
          echo 'user_allow_other' | sudo tee -a /etc/fuse.conf
      - name: rclone <-> WebDAV round-trip (gating)
        run: client/test-conformance/webdav-rclone.sh
      - name: fsx <-> FUSE data-integrity exerciser (gating)
        run: client/test-conformance/fsx-fuse.sh 100000
      - name: pjdfstest <-> FUSE POSIX conformance map (informational)
        continue-on-error: true
        run: client/test-conformance/pjdfstest-fuse.sh
