name: Nightly (heavy / cross-platform)

# The engine/mount-level two-device E2E suites that need a LOCAL RAILS SERVER, kept off the per-PR
# loop because they are slow. Runs overnight and on-demand — trigger it manually (Actions tab →
# "Run workflow", or `gh workflow run nightly.yml --ref <branch>`).
#
# THIS FILE USED TO BE TWELVE JOBS; FIVE REMAIN. The other seven — windows-build,
# fuser-mount-smoke-linux, e2e-windows, two-device-cfapi-windows, windows-smoke, cfapi-conformance,
# mount-conformance — were pure cargo builds/tests or hit the DEPLOYED server via SERVER_URL, with
# no dependency on this repo at all, and moved wholesale to tinkerex-client's own CI along with
# client/ (docs/superpowers/plans/2026-08-20-stage-1-extract-client.md). The five here could not
# move with them: each either runs `bin/rails server -p 3001 &` inline, or calls a
# test-conformance script that does — e2e-linux, e2e-macos and stress-load-and-multifiletype-linux
# do the former; two-device-fuse-linux and two-device-webdav-macos do the latter (their scripts
# boot their own STORAGE_BACKEND=local Rails server, per each script's own header comment). The
# extraction plan's own summary named only the first three as "Rails-coupled" — the other two
# were found by reading the scripts, not by trusting that count, and are exactly the same shape.
#
# See client-contract.yml for the PR-time sibling of this file (engine-integration, the fast wire-
# contract gate) and for the full argument on why these jobs stay in tinkerex rather than moving —
# it applies unchanged to every job below.
on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch:

concurrency:
  # Key on event_name too so a manual `workflow_dispatch` verify run and the scheduled `cron`
  # run land in SEPARATE groups and don't cancel each other (they only cancel a prior run of
  # the SAME event). Without this, the nightly cron silently cancels an in-flight manual run.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # Which runner families exist for this run. See ci/preflight.sh — a DECLARATION (the repo variable
  # CI_RUNNERS), not an API call, because a workflow GITHUB_TOKEN cannot list runners.
  #
  # This matters most on a SCHEDULED workflow. Before the gate, the 08:00 and 08:30 crons fired daily
  # into a void: every job queued, GitHub cancelled them 24h later, and the run history filled with
  # `cancelled` at 24h0m0s. Now a scheduled run completes in seconds and says on its own page which
  # coverage it could not run.
  preflight:
    runs-on: [self-hosted, macos]
    outputs:
      macos:   ${{ steps.p.outputs.macos }}
      linux:   ${{ steps.p.outputs.linux }}
      windows: ${{ steps.p.outputs.windows }}
    steps:
      - uses: actions/checkout@v7
        with: { clean: false }
      - id: p
        name: Resolve the declared runner fleet
        env:
          CI_RUNNERS: ${{ vars.CI_RUNNERS }}
        run: ci/preflight.sh | tee -a "$GITHUB_OUTPUT"
      - name: Report what is available, and what was therefore skipped
        env:
          CI_RUNNERS: ${{ vars.CI_RUNNERS }}
        run: ci/preflight.sh --summary >> "$GITHUB_STEP_SUMMARY"

  # --- Two-device END-TO-END on Linux + macOS (the headline multi-device workflow) -----------
  # The same client stack the Tauri app runs (fs-provider tree + sync-engine loop + ServerClient
  # API), exercised as TWO independent devices paired into one library: A writes → B pulls +
  # hydrates → B edits → A pulls, byte-for-byte, plus delete/move/rename/dedup/restore/conflict.
  # This is the PROVIDER/ENGINE-LEVEL leg (headless); the kernel-mount leg is the per-OS conformance
  # suites' job, now in tinkerex-client's own CI (cfapi-conformance/mount-conformance) plus
  # two-device-fuse-linux/two-device-webdav-macos below (kept here because THEY also need Rails).
  # Both are self-contained: each boots its own STORAGE_BACKEND=local Rails server, needed for real
  # presigned URLs — see below.

  e2e-linux:
    # Self-contained: boot STORAGE_BACKEND=local Rails (SQLite) here, like engine-integration in
    # client-contract.yml.
    needs: preflight
    if: ${{ needs.preflight.outputs.linux == 'true' }}
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
        with: { clean: false }
      # SECOND checkout + symlink: see client-contract.yml's engine-integration job for the full
      # argument. Every `client/...` path below is unchanged from before the client/ split.
      - name: Check out tinkerex-client
        uses: actions/checkout@v7
        with:
          repository: chaim354/tinkerex-client
          ssh-key: ${{ secrets.TINKEREX_CLIENT_DEPLOY_KEY }}
          path: tinkerex-client
          clean: false
      - name: Symlink client/ to the second checkout
        run: |
          rm -rf client
          ln -s tinkerex-client/client client
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: FUSE dev headers (sync-engine pulls fs-fuse on Linux)
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::=--force-confold libfuse-dev pkg-config
      - name: Prepare the dev database (SQLite)
        run: bin/rails db:prepare
      # STORAGE_BACKEND=local, verify ON (no SYNC_VERIFY_FINALIZE=0): two_device_e2e moves bytes
      # via PresignedIO, the production transport, so it needs a backend that presigns real
      # absolute HMAC-signed URLs (the memory store's relative /dev/blobs/... paths aren't
      # followable by a Rust HTTP client) — and since the bytes genuinely land in storage now,
      # finalize's verify-the-bytes-landed check can run for real instead of being disabled.
      - name: Boot the sync server + run the two-device e2e (one step keeps the server alive)
        env:
          SYNC_IT_SERVER_URL: http://localhost:3001
        run: |
          (fuser -k 3001/tcp 2>/dev/null || pkill -f 'puma' 2>/dev/null) || true
          sleep 1
          STORAGE_BACKEND=local CHUNK_PUBLIC_URL=http://localhost:3001 ENABLE_TEST_SIGNUP=true bin/rails server -p 3001 &
          SRV=$!
          for i in $(seq 1 60); do curl -sf http://localhost:3001/up >/dev/null && { echo "server up"; break; }; sleep 1; done
          curl -sf http://localhost:3001/up >/dev/null || { echo "server failed to start"; kill $SRV 2>/dev/null; exit 1; }
          set +e
          cargo test --manifest-path client/sync-engine/Cargo.toml --test two_device_e2e -- --nocapture
          code=$?
          set -e
          kill $SRV 2>/dev/null || true
          exit $code

  # --- Stress / load + multi-filetype conformance (heavier; additive, never reds the nightly) ---
  # Two suites that push the data plane well past the 2-device tests:
  #   * concurrency_load        — N (10–50) real client threads vs ONE server: concurrent commits
  #                               (distinct + same-node→conflict), concurrent pulls+hydrates while
  #                               writing, a far-behind device paging a growing changelog. Asserts
  #                               no loss, convergence, no torn manifests, monotonic changelog.
  #   * multifiletype_conformance — a diverse maker-file corpus (STL ascii/binary, 3MF zip,
  #                               STEP/IGES, OBJ, .lbrn2, PNG/JPG, gcode, md/txt, large
  #                               random + repetitive binaries) round-tripped byte-for-byte +
  #                               dedup on edit, sequentially and under a concurrent storm.
  # continue-on-error: these are heavy/exploratory — a flake or a runner-resource limit must not
  # red the whole nightly. Scale knobs: LOAD_DEVICES / LOAD_FILES_PER_DEVICE / LOAD_READERS.
  stress-load-and-multifiletype-linux:
    needs: preflight
    if: ${{ needs.preflight.outputs.linux == 'true' }}
    continue-on-error: true
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
        with: { clean: false }
      - name: Check out tinkerex-client
        uses: actions/checkout@v7
        with:
          repository: chaim354/tinkerex-client
          ssh-key: ${{ secrets.TINKEREX_CLIENT_DEPLOY_KEY }}
          path: tinkerex-client
          clean: false
      - name: Symlink client/ to the second checkout
        run: |
          rm -rf client
          ln -s tinkerex-client/client client
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: FUSE dev headers (sync-engine pulls fs-fuse on Linux)
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::=--force-confold libfuse-dev pkg-config
      - name: Prepare the dev database (SQLite)
        run: bin/rails db:prepare
      - name: Boot the sync server + run the stress/load + multi-filetype suites
        env:
          SYNC_IT_SERVER_URL: http://localhost:3001
        run: |
          (fuser -k 3001/tcp 2>/dev/null || pkill -f 'puma' 2>/dev/null) || true
          sleep 1
          STORAGE_BACKEND=memory ENABLE_TEST_SIGNUP=true SYNC_VERIFY_FINALIZE=0 bin/rails server -p 3001 &
          SRV=$!
          for i in $(seq 1 60); do curl -sf http://localhost:3001/up >/dev/null && { echo "server up"; break; }; sleep 1; done
          curl -sf http://localhost:3001/up >/dev/null || { echo "server failed to start"; kill $SRV 2>/dev/null; exit 1; }
          set +e
          cargo test --manifest-path client/sync-engine/Cargo.toml --test concurrency_load -- --nocapture
          c1=$?
          cargo test --manifest-path client/sync-engine/Cargo.toml --test multifiletype_conformance -- --nocapture
          c2=$?
          set -e
          kill $SRV 2>/dev/null || true
          [ $c1 -eq 0 ] && [ $c2 -eq 0 ]

  e2e-macos:
    # macOS client stack. Self-contained: boots a STORAGE_BACKEND=local Rails server locally
    # (the mac runner can't route to the deployed server's network segment), so it proves the
    # macOS client stack converges without depending on cross-network reachability. fuser is
    # cfg(linux), so sync-engine builds with no FUSE on mac.
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v7
        with: { clean: false }
      - name: Check out tinkerex-client
        uses: actions/checkout@v7
        with:
          repository: chaim354/tinkerex-client
          ssh-key: ${{ secrets.TINKEREX_CLIENT_DEPLOY_KEY }}
          path: tinkerex-client
          clean: false
      - name: Symlink client/ to the second checkout
        run: |
          rm -rf client
          ln -s tinkerex-client/client client
      - uses: dtolnay/rust-toolchain@stable
      # Use the runner's preinstalled Ruby/bundler (the maker-mac dev box) — ruby/setup-ruby
      # assumes the GitHub-hosted /Users/runner layout this self-hosted runner doesn't have.
      # STORAGE_BACKEND=local, verify ON (no SYNC_VERIFY_FINALIZE=0) — same reasoning as e2e-linux:
      # PresignedIO needs real absolute presigned URLs, and since the bytes genuinely land in
      # storage now, verify-on-finalize can (and should) run for real.
      - name: Boot the sync server + run the two-device e2e (one step keeps the server alive)
        env:
          SYNC_IT_SERVER_URL: http://localhost:3001
        run: |
          bundle install --quiet
          bin/rails db:prepare
          (lsof -ti tcp:3001 | xargs kill -9 2>/dev/null) || true
          sleep 1
          STORAGE_BACKEND=local CHUNK_PUBLIC_URL=http://localhost:3001 ENABLE_TEST_SIGNUP=true bin/rails server -p 3001 &
          SRV=$!
          for i in $(seq 1 60); do curl -sf http://localhost:3001/up >/dev/null && { echo "server up"; break; }; sleep 1; done
          curl -sf http://localhost:3001/up >/dev/null || { echo "server failed to start"; kill $SRV 2>/dev/null; exit 1; }
          set +e
          cargo test --manifest-path client/sync-engine/Cargo.toml --test two_device_e2e -- --nocapture
          code=$?
          set -e
          kill $SRV 2>/dev/null || true
          exit $code

  # --- Two-device REAL-MOUNT END-TO-END that ALSO needs a local Rails server ------------------
  # These mount TWO real kernel mounts at once (the same Daemon/FuseAdapter/WebdavMount the Tauri
  # app's sync_start launches), pair them into one library via the REAL pairing flow, and pass a
  # file THROUGH one mount to be read byte-for-byte THROUGH the other — plus new/nested/delete/
  # rename/multi-chunk. This is the syscall→adapter→Provider leg the engine-level e2e can't reach.
  # Unlike the CfAPI equivalent (moved to tinkerex-client: it targets the DEPLOYED server), both of
  # these scripts boot their OWN STORAGE_BACKEND=local Rails server — see each script's header —
  # which is why they stay here rather than moving with the rest of test-conformance/.

  two-device-fuse-linux:
    # Linux FUSE CAN mount in CI when /dev/fuse is available, so this real-mount leg is automated.
    # The script self-detects a missing /dev/fuse / allow_other and exits 0 with a BLOCKED notice
    # rather than a false failure (an environment gap, documented in the script). continue-on-error
    # so a runner without /dev/fuse never reds the nightly.
    needs: preflight
    if: ${{ needs.preflight.outputs.linux == 'true' }}
    continue-on-error: true
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v7
        with: { clean: false }
      - name: Check out tinkerex-client
        uses: actions/checkout@v7
        with:
          repository: chaim354/tinkerex-client
          ssh-key: ${{ secrets.TINKEREX_CLIENT_DEPLOY_KEY }}
          path: tinkerex-client
          clean: false
      # The script itself (client/test-conformance/two-device-fuse.sh) does
      # `cd "$(dirname "$0")/../.."` to find the repo root it expects bin/rails in. Through this
      # symlink that lands back at THIS checkout's root — bash's logical `cd` strips `..`
      # components textually against the invoking path rather than resolving the symlink first
      # (verified empirically) — so the script needs no edit even though its own repo moved.
      - name: Symlink client/ to the second checkout
        run: |
          rm -rf client
          ln -s tinkerex-client/client client
      - uses: dtolnay/rust-toolchain@stable
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: System deps (FUSE + allow_other)
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -o Dpkg::Options::=--force-confold libfuse-dev fuse pkg-config
          grep -q '^user_allow_other' /etc/fuse.conf || echo 'user_allow_other' | sudo tee -a /etc/fuse.conf
      - name: Prepare the dev database (SQLite)
        run: bin/rails db:prepare
      - name: Two real FUSE mounts, A<->B byte-for-byte through the mounts
        run: client/test-conformance/two-device-fuse.sh

  two-device-webdav-macos:
    # macOS WebDAV: mount TWO real native mount_webdav mounts at once and pass files between them
    # THROUGH the mounts. mount_webdav needs an INTERACTIVE desktop login session (it won't hold a
    # mount from a headless launchd/ssh context) — same caveat as Windows CfAPI. The script
    # self-detects a mount that won't come up and exits 0 with a BLOCKED notice rather than a false
    # failure. continue-on-error so a service-mode runner never reds the nightly; this passes only on
    # an INTERACTIVE self-hosted macOS runner (see ci/runners/README.md "interactive sessions").
    continue-on-error: true
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v7
        with: { clean: false }
      - name: Check out tinkerex-client
        uses: actions/checkout@v7
        with:
          repository: chaim354/tinkerex-client
          ssh-key: ${{ secrets.TINKEREX_CLIENT_DEPLOY_KEY }}
          path: tinkerex-client
          clean: false
      # Same symlink seam as two-device-fuse-linux above — the script's own
      # `cd "$(dirname "$0")/../.."` lands back at this checkout's root, where bin/rails is.
      - name: Symlink client/ to the second checkout
        run: |
          rm -rf client
          ln -s tinkerex-client/client client
      - uses: dtolnay/rust-toolchain@stable
      # Preinstalled Ruby/bundler on the maker-mac box (ruby/setup-ruby assumes the hosted layout).
      # The script self-boots a STORAGE_BACKEND=local server and runs db:prepare itself.
      - name: Two real WebDAV mounts, A<->B byte-for-byte through the mounts
        run: |
          bundle install --quiet
          client/test-conformance/two-device-webdav-macos.sh
