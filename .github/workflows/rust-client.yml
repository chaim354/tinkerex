name: Rust client

# The Rust client crates' CI. Jobs:
#  - unix: build/test the hermetic crates on Linux (fast feedback; no server needed).
#  - engine-integration: boot the real Rails server (SQLite + in-memory chunk store) and
#    run the sync-engine integration suite against it — the actual HTTP wire contract.
#  - winfsp-windows: actually COMPILE the Windows mount adapter (`fs-winfsp`), which
#    can't be built on the maintainer's macOS box — this is its real verification gate.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  unix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: FUSE dev headers (for fs-fuse / sync-engine)
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev pkg-config
      - name: Test fs-provider
        run: cargo test --manifest-path client/fs-provider/Cargo.toml
      - name: Test sync-client
        run: cargo test --manifest-path client/sync-client/Cargo.toml
      - name: Build fs-fuse
        run: cargo build --manifest-path client/fs-fuse/Cargo.toml
      - name: Build sync-engine (Daemon + maker-syncd)
        run: cargo build --manifest-path client/sync-engine/Cargo.toml --bins
      - name: Build fs-winfsp on non-Windows (must be an inert empty crate)
        run: cargo build --manifest-path client/fs-winfsp/Cargo.toml

  engine-integration:
    # The sync-engine talks to the server over HTTP; this job stands up the real Rails
    # app (SQLite, STORAGE_BACKEND=memory → control plane only, chunk bytes via the test's
    # shared-dir stand-in) and runs the integration suite against it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: FUSE dev headers (sync-engine pulls fs-fuse on Linux)
        run: sudo apt-get update && sudo apt-get install -y libfuse-dev pkg-config
      - name: Prepare the dev database (SQLite)
        run: bin/rails db:prepare
      - name: Boot the sync server (memory chunk store)
        run: |
          STORAGE_BACKEND=memory bin/rails server -p 3001 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/up >/dev/null && { echo "server up"; break; }
            sleep 1
          done
          curl -sf http://localhost:3001/up >/dev/null || { echo "server failed to start"; exit 1; }
      - name: Run the engine integration suite against the live server
        env:
          SYNC_IT_SERVER_URL: http://localhost:3001
        run: cargo test --manifest-path client/sync-engine/Cargo.toml --test integration

  mount-conformance:
    # External, battle-tested suites pointed at our real mount surfaces (what JuiceFS/
    # CephFS gate on). rclone⇄WebDAV and fsx⇄FUSE gate the build; pjdfstest is an
    # informational POSIX conformance map (continue-on-error). See
    # client/test-conformance/README.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: System deps (FUSE, rclone, build tools, autotools)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfuse-dev fuse pkg-config build-essential \
            rclone curl git autoconf automake libtool
          # AutoUnmount on the maker-mount needs user_allow_other.
          echo 'user_allow_other' | sudo tee -a /etc/fuse.conf
      - name: rclone ⇄ WebDAV round-trip (gating)
        run: client/test-conformance/webdav-rclone.sh
      - name: fsx ⇄ FUSE data-integrity exerciser (gating)
        run: client/test-conformance/fsx-fuse.sh 100000
      - name: pjdfstest ⇄ FUSE POSIX conformance map (informational)
        continue-on-error: true
        run: client/test-conformance/pjdfstest-fuse.sh

  winfsp-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install WinFsp (driver + SDK headers/libs)
        run: choco install winfsp -y --no-progress
      - name: Install LLVM (libclang, for winfsp-sys bindgen)
        run: choco install llvm -y --no-progress
      - name: Build fs-winfsp + maker-mount-win
        env:
          # bindgen needs libclang; choco installs LLVM here.
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo build --manifest-path client/fs-winfsp/Cargo.toml --bins
