name: Rust client

# FAST per-PR gate. Runs only on the two always-on self-hosted runners (macOS + Linux) so the
# loop never waits on the Windows desktop. The slow / cross-platform / live jobs (Windows builds,
# the live CfAPI smoke, fsx/pjdfstest conformance) live in `nightly.yml` (cron + on-demand).
on:
  push:
    branches: [ main ]
  pull_request:
    paths:
      - 'client/**'
      - '.github/workflows/rust-client.yml'
  workflow_dispatch:

# Single self-hosted runner per OS + fixed test ports → overlapping runs collide. Serialize.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # Detect whether anything that affects the Windows client changed, so the (slower) Windows
    # build + live smoke only run when relevant — not on Mac-only / Linux-only / docs changes.
    runs-on: [self-hosted, linux]
    outputs:
      windows: ${{ steps.filter.outputs.windows }}
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            windows:
              - 'client/fs-cfapi/**'
              - 'client/fs-winfsp/**'
              - 'client/sync-engine/**'
              - 'client/fs-provider/**'
              - 'client/sync-client/**'
              - 'client/test-conformance/cfapi-smoke.ps1'
              - '.github/workflows/rust-client.yml'

  mac-tests:
    # The fastest box does the most: every hermetic Rust test (all cross-platform) PLUS the
    # CfAPI Windows-FFI cross-check (cargo check --target windows-gnu) PLUS the native macOS
    # mount build. `clean: false` keeps target/ warm across runs → incremental compiles.
    runs-on: [self-hosted, macos]
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Hermetic crate tests (fs-provider, sync-client, fs-cfapi)
        run: |
          cargo test --manifest-path client/fs-provider/Cargo.toml
          cargo test --manifest-path client/sync-client/Cargo.toml
          cargo test --manifest-path client/fs-cfapi/Cargo.toml
      - name: Cross-check the CfAPI Windows FFI (catches most cfg(windows) breakage)
        run: cargo check --target x86_64-pc-windows-gnu --manifest-path client/fs-cfapi/Cargo.toml
      - name: Native macOS build (fs-webdav mount + sync-engine bins)
        run: |
          cargo build --manifest-path client/fs-webdav/Cargo.toml
          cargo build --manifest-path client/sync-engine/Cargo.toml --bins

  linux-build:
    # The Linux-only FUSE mount path (fuser is cfg(target_os = "linux")), built in parallel with
    # the Mac job. Tests themselves run on the Mac; this just proves the Linux compile.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
      - name: FUSE dev headers
        run: sudo apt-get install -y libfuse-dev pkg-config
      - name: Build fs-fuse + sync-engine bins (Linux mount path)
        run: |
          cargo build --manifest-path client/fs-fuse/Cargo.toml
          cargo build --manifest-path client/sync-engine/Cargo.toml --bins
      - name: Build fs-winfsp on non-Windows (must be an inert empty crate)
        run: cargo build --manifest-path client/fs-winfsp/Cargo.toml

  engine-integration:
    # The HTTP wire contract: boot the real Rails server (SQLite + memory chunk store) and run
    # the sync-engine integration suite against it. On Linux in parallel with the Mac job.
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: FUSE dev headers (sync-engine pulls fs-fuse on Linux)
        run: sudo apt-get install -y libfuse-dev pkg-config
      - name: Prepare the dev database (SQLite)
        run: bin/rails db:prepare
      - name: Boot the sync server (memory chunk store)
        run: |
          STORAGE_BACKEND=memory bin/rails server -p 3001 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/up >/dev/null && { echo "server up"; break; }
            sleep 1
          done
          curl -sf http://localhost:3001/up >/dev/null || { echo "server failed to start"; exit 1; }
      - name: Run the engine integration suite against the live server
        env:
          SYNC_IT_SERVER_URL: http://localhost:3001
        run: cargo test --manifest-path client/sync-engine/Cargo.toml --test integration

  windows-build:
    # The real Windows mount adapters (fs-cfapi + fs-winfsp) + sync-engine wiring — the only place
    # winfsp-sys (msvc) and the cfg(windows) daemon code actually link. Runs only when something
    # affecting the Windows client changed (or on manual dispatch). LLVM/WinFsp preinstalled by
    # ci/runners/setup-windows.ps1. clean: false keeps target/ warm.
    needs: changes
    if: ${{ needs.changes.outputs.windows == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
      - name: Build fs-cfapi (lib + maker-cfapi)
        run: cargo build --manifest-path client/fs-cfapi/Cargo.toml --bins
      - name: Build fs-winfsp (WinFsp adapter)
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo build --manifest-path client/fs-winfsp/Cargo.toml --bins
      - name: Build sync-engine on Windows (CfApiMount + WinfspMount + maker-cfsyncd)
        env:
          LIBCLANG_PATH: C:\Program Files\LLVM\bin
        run: cargo build --manifest-path client/sync-engine/Cargo.toml --bins

  windows-smoke:
    # The LIVE CfAPI write-path proof (register -> enumerate -> hydrate -> new/edit/delete/rename),
    # gated the same way. Needs the Windows runner online + the deployed server reachable.
    needs: [changes, windows-build]
    if: ${{ needs.changes.outputs.windows == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, windows]
    steps:
      - uses: actions/checkout@v5
        with: { clean: false }
      - uses: dtolnay/rust-toolchain@stable
      - name: Live CfAPI smoke (register -> enumerate -> hydrate -> new/edit/delete/rename)
        shell: powershell
        env:
          SERVER_URL: http://192.168.1.95
        run: ./client/test-conformance/cfapi-smoke.ps1
