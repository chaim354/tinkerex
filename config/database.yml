# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  # HOW LONG A WRITER WAITS FOR SQLite's SINGLE WRITE LOCK, in ms. 5000 until 2026-08-20, raised
  # after CLAUDE.md §12.7's intermittent was diagnosed: it is an FSYNC problem, not a lock-logic
  # one. Under sustained disk I/O the holder's fsync outlasts the wait and the WAITER raises
  # `SQLite3::BusyException` — measured 3 of 8 suite runs with `dd`+`sync` loops running against
  # 0 of 12 on a quiet box. It landed in `User#next_seq!`, where every commit, mutation, restore
  # and conflict serialized -- a path that LEFT THIS PROCESS with the sync engine on 2026-08-25,
  # so `next_seq!` now has no caller here at all. Re-measured on the engine-free tree under the
  # same disk pressure: 0 of 12 share-leg runs (tinkerex#124). The number below is kept as the
  # SELF-HOST ceiling it always was, not because this suite still needs it.
  #
  # THIS IS A PRODUCTION SETTING, not a test knob — self-host SQLite inherits this anchor, so the
  # number is the concurrency ceiling for a self-host box under disk pressure.
  #
  # THE TRADE IS A SLOW WRITE INSTEAD OF A FAST 500, AND IT HAS A CEILING OF ITS OWN. Production
  # runs `RAILS_MAX_THREADS: 16` on one Puma worker, so in the worst case 16 requests can each sit
  # here for the full wait and occupy every thread — the same head-of-line argument §14c makes for
  # `ADDON_SERVICE_MAX_TIMEOUT`. 15s is chosen to cover an fsync stall, NOT to make an arbitrarily
  # contended box succeed; if writes are still timing out, the answer is fewer concurrent writers
  # or a faster disk, not a bigger number here.
  #
  # NOTE `PRAGMA busy_timeout` READS 0 AND THAT IS EXPECTED — Rails applies this through the
  # sqlite3 gem's Ruby-level `busy_handler_timeout` (`sqlite3_adapter.rb:853-856`), not the pragma.
  # That attribute is WRITE-ONLY, so neither the pragma nor the gem can tell you this value took
  # effect; `test/sqlite_concurrency_test.rb` measures a real blocked writer instead.
  timeout: 15000

# Postgres profile (managed/SaaS) — used when DATABASE_URL is set, e.g.
#   DATABASE_URL=postgresql://postgres:postgres@localhost:5432/tinkerex_test
# Self-host stays on the SQLite default below. (Sync-server implementation notes moved to
# chaim354/tinkerex-sync, docs/SYNC_SERVER.md, on 2026-08-25.)
#
# TLS: managed Postgres (Neon/RDS/Supabase) requires TLS. Set it via DATABASE_URL
#   (...?sslmode=require)  — or override DB_SSLMODE here. We default to `require` for any
#   non-local host so a managed deploy is encrypted by default; `prefer` for localhost so the
#   Docker/dev box (no TLS) still connects. For strong MITM protection on a real deploy use
#   `verify-full` plus DB_SSLROOTCERT (the provider's CA bundle). DATABASE_URL params win over
#   these (libpq precedence), so a sslmode in the URL is authoritative.
postgres: &postgres
  adapter: postgresql
  url: <%= ENV["DATABASE_URL"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  sslmode: <%= ENV["DB_SSLMODE"] || (ENV["DATABASE_URL"].to_s.match?(/@(localhost|127\.0\.0\.1)/) ? "prefer" : "require") %>
  <% if ENV["DB_SSLROOTCERT"].present? %>
  sslrootcert: <%= ENV["DB_SSLROOTCERT"] %>
  <% end %>
  # THIS CONSTRAINT IS THE SYNC SERVER'S, NOT THIS APP'S, SINCE THE ENGINE LEFT (2026-08-25).
  # It exists because next_seq!'s row lock must span a transaction on one backend connection, so a
  # pooler in front of THAT server must be session/transaction mode, never statement. This app has
  # no caller for next_seq! and no boot check for it -- the initializer this comment used to name,
  # config/initializers/postgres_pooler_check.rb, went with the engine and does not exist here.
  # See chaim354/tinkerex-sync, docs/SYNC_SERVER.md -- and note the correction attached to that
  # section: the probe lives there but nothing invokes it yet either.

development:
  <% if ENV["DATABASE_URL"].to_s.start_with?("postgres") %>
  <<: *postgres
  <% else %>
  <<: *default
  database: storage/development.sqlite3
  <% end %>

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <% if ENV["DATABASE_URL"].to_s.start_with?("postgres") %>
  <<: *postgres
  <% else %>
  <<: *default
  database: storage/test.sqlite3
  <% end %>


# Production. TWO shapes from the SAME file (adapter-agnostic, §7):
#
#  • SELF-HOST (default) — SQLite. Primary + the three Solid stores (cache/queue/cable) are
#    separate SQLite files under storage/ (a Docker persistent volume). One box, local disk,
#    nothing to coordinate — the right default for a single-user self-host.
#
#  • MANAGED (DATABASE_URL is Postgres) — the Solid stores move OFF SQLite onto Postgres too.
#    A managed deploy is multi-instance and/or has ephemeral local disk, so a per-instance
#    SQLite file for queue/cache/cable is wrong: jobs enqueued on instance A wouldn't be seen
#    by the worker on instance B, and a redeploy would drop the queue. Each Solid role gets its
#    OWN Postgres database (separate schema namespaces; isolates their churn/locks from the
#    primary). Default DB names derive from the primary (…_cache/_queue/_cable); override any
#    of them with SOLID_{CACHE,QUEUE,CABLE}_DATABASE_URL (e.g. to put them on a cheaper
#    instance). NOTE: point the Solid roles at a SESSION/TRANSACTION-mode pooler too — same
#    constraint as the primary (Solid Queue uses FOR UPDATE SKIP LOCKED). See
#    chaim354/tinkerex-sync, docs/SYNC_SERVER.md.
<% pg = ENV["DATABASE_URL"].to_s.start_with?("postgres") %>
<% derive = ->(role_url, suffix) {
     ENV[role_url].presence ||
       (ENV["DATABASE_URL"].to_s.sub(%r{(/[^/?]+)(\?|$)}) { "#{$1}_#{suffix}#{$2}" })
   } %>
production:
  <% if pg %>
  primary:
    <<: *postgres
  cache:
    <<: *postgres
    url: <%= derive.call("SOLID_CACHE_DATABASE_URL", "cache") %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *postgres
    url: <%= derive.call("SOLID_QUEUE_DATABASE_URL", "queue") %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *postgres
    url: <%= derive.call("SOLID_CABLE_DATABASE_URL", "cable") %>
    migrations_paths: db/cable_migrate
  <% else %>
  primary:
    <<: *default
    database: storage/production.sqlite3
  cache:
    <<: *default
    database: storage/production_cache.sqlite3
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: storage/production_queue.sqlite3
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: storage/production_cable.sqlite3
    migrations_paths: db/cable_migrate
  <% end %>
