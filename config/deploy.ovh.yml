# Kamal destination overlay for the OVH prod-like TEST box (deep-merged over deploy.yml).
#   Deploy with:  kamal deploy -d ovh
#
# Same image (ghcr.io/chaim354/tinkerex), same Rails app as the Unraid deploy — this only
# overrides the target server, its ssh user, and the chunk-storage backend (Cloudflare R2
# instead of the Unraid SeaweedFS box). Bytes still move client <-> R2 via presigned URLs;
# the Rails box only signs, so it needn't reach R2.
#
# BOTH R2 credentials (Access Key ID + Secret) are kept OUT of git — sourced from the
# shell via .kamal/secrets-common, never committed. Only the non-secret endpoint/bucket/
# region are in clear. Before deploying:
#   export CHUNK_ACCESS_KEY_ID=<R2 token Access Key ID>
#   export CHUNK_SECRET_ACCESS_KEY=<R2 token Secret Access Key>
#   export KAMAL_REGISTRY_PASSWORD=<github packages token>

servers:
  web:
    - 15.204.216.249

ssh:
  user: ubuntu

# No builder override: this overlay inherits `builder: arch: amd64` from deploy.yml, so the
# image is cross-built ONCE on the Mac (QEMU, ~84 s cold / cache-fast incremental) and pushed
# to ghcr. Both this OVH box and the Unraid box pull that same amd64 image — no build, no repo
# checkout, and no source transfer to either server. (Reverting to an on-box build is just
# `builder: { remote: ssh://ubuntu@15.204.216.249, arch: amd64 }` here.)

env:
  # No env.secret block here on purpose: a destination overlay REPLACES (not unions) the
  # base env.secret list, so re-declaring it risks dropping RAILS_MASTER_KEY /
  # CHUNK_SECRET_ACCESS_KEY and breaking boot ("Missing secret_key_base"). We inherit the
  # base secrets and override only the chunk-store CLEAR vars. The R2 Access Key ID is
  # pulled from the shell via ERB (no literal credential in git); the real secret
  # (CHUNK_SECRET_ACCESS_KEY) stays in the inherited base env.secret, also shell-sourced.
  clear:
    STORAGE_BACKEND: s3
    CHUNK_ENDPOINT: https://d1ea7ae1da7f90fb8edd168ab7928e7d.r2.cloudflarestorage.com
    CHUNK_BUCKET: maker-chunks-prod
    CHUNK_REGION: auto
    CHUNK_ACCESS_KEY_ID: <%= ENV["CHUNK_ACCESS_KEY_ID"] %>

    # Sidecar accessories run on the UNRAID host (see `accessories:` in deploy.yml, whose `host:` is
    # 192.168.1.95), so `tinkerex-boxes` / `tinkerex-openscad` do not resolve on this box. Kamal
    # DEEP-MERGES env.clear, so without these explicit blanks the overlay inherits the Unraid
    # hostnames, each addon reports configured? == true, and every call fails — strictly worse than
    # the addon greying out. Blank -> `configured?` is false -> "Unavailable here". Set these to a
    # real URL if a sidecar is ever booted on OVH.
    BOXES_SIDECAR_URL: ""
    OPENSCAD_SIDECAR_URL: ""
