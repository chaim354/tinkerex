# Kamal destination overlay for the OVH prod-like TEST box (deep-merged over deploy.yml).
#   Deploy with:  kamal deploy -d ovh
#
# Same image (ghcr.io/chaim354/tinkerex), same Rails app as the Unraid deploys — this overrides
# the target server, its ssh user, and the env vars naming services that run as accessories on
# the Unraid host and therefore do not resolve from here.
#
# THIS OVERLAY NAMES NO LIBRARY BACKEND, SO IT INHERITS THE BASE'S `chunk_remote` AND CANNOT BOOT.
# It used to describe "the chunk-storage backend (Cloudflare R2 instead of the Unraid SeaweedFS
# box)" — that axis is gone: Arc D Part 2 moved the chunk store to the `sync` accessory, and no
# code in this repo reads STORAGE_BACKEND or any CHUNK_* storage knob any more (§7, §14a). What is
# left behind is a destination whose merged config declares LIBRARY_BACKEND=chunk_remote with a
# blanked CHUNK_REMOTE_URL and no SYNC_ADMIN_TOKEN, which LibraryBackendCheck refuses at boot.
# The open decision, and the cost of each answer, is at CHUNK_REMOTE_URL below — deliberately not
# made in a mechanical cleanup, because this is the one internet-facing box (`servers:` below).
#
# Secrets are resolved from 1Password by .kamal/secrets.ovh, this destination's own secrets file
# (kamal does not read .kamal/secrets under `-d`). No exports needed; verify with
#   bin/secrets-preflight ovh

servers:
  web:
    - 15.204.216.249

ssh:
  user: ubuntu

# No builder override: this overlay inherits `builder: arch: amd64` from deploy.yml, so the
# image is cross-built ONCE on the Mac (QEMU, ~84 s cold / cache-fast incremental) and pushed
# to ghcr. Both this OVH box and the Unraid box pull that same amd64 image — no build, no repo
# checkout, and no source transfer to either server. (Reverting to an on-box build is just
# `builder: { remote: ssh://ubuntu@15.204.216.249, arch: amd64 }` here.)

env:
  # env.secret is an ARRAY, and kamal REPLACES arrays on merge (deep_merge unions hashes only).
  # So this list is the WHOLE list for this destination — RAILS_MASTER_KEY must be re-stated or
  # boot dies with "Missing secret_key_base". That is why the s3 and share overlays re-state it
  # too. Values come from .kamal/secrets.ovh, which kamal does not read under `-d`.
  #
  # CHUNK_SECRET_ACCESS_KEY AND CHUNK_ACCESS_KEY_ID WERE HERE — the R2 token and key id for
  # bucket maker-chunks-prod, from when the maker app resolved a chunk store of its own. Arc D
  # Part 2 handed the chunk store to the `sync` accessory (a separate repo, its own env), and
  # nothing in THIS app has read a CHUNK_* storage knob since. Dead here was not free: kamal runs
  # every `$(…)` in a parsed secrets file EAGERLY, so each one was a 1Password read on every
  # `-d ovh` deploy for a value no container consumed. Removed from .kamal/secrets.ovh too.
  #
  # ⚠️ REPLACING THIS ARRAY ALSO DROPS THE BASE'S SYNC_ADMIN_TOKEN, and that is correct as long as
  # this destination's APP does not send it. The `sync` accessory still requires the key, but
  # `accessories:` is never overlaid, so it reaches every destination through that path and must
  # stay DEFINED in .kamal/secrets.ovh (docs/invariants/deploy-secrets.md, §14g). Re-list it here
  # only if this box's app itself starts sending it — i.e. only under LIBRARY_BACKEND=chunk_remote.
  secret:
    - RAILS_MASTER_KEY
  clear:
    # STORAGE_BACKEND / CHUNK_ENDPOINT / CHUNK_BUCKET / CHUNK_REGION WERE HERE (R2: endpoint
    # d1ea7ae1…r2.cloudflarestorage.com, bucket maker-chunks-prod, region auto). Same reason as
    # the two secrets above — no code in this repo reads any of those names, so kamal was shipping
    # four values into a container that ignored them. deploy.share.yml and deploy.s3.yml carry the
    # same tombstone; this was the last overlay still declaring the axis.
    #
    # THE TRANSFERABLE LESSON FROM THE CHUNK_ACCESS_KEY_ID LINE THAT SAT HERE, WHICH OUTLIVES THE
    # KEY ITSELF: a value defined in a .kamal/secrets* file is NEVER visible to ERB in env.clear.
    # Kamal secrets feed env.secret lookups; they are not exported into the process ENV that an
    # ERB output tag reading that name would see. Unset, the tag rendered empty, YAML parsed nil,
    # and the whole destination refused to LOAD —
    #   Kamal::ConfigurationError: env/clear/CHUNK_ACCESS_KEY_ID: should be a string
    # — so `-d ovh` was unusable without a manual export. If a secrets-file value must reach a
    # container, it goes in env.secret; never into env.clear through ERB.
    #
    # ⚠️ AND DO NOT SPELL AN ERB TAG LITERALLY IN THIS COMMENT TO ILLUSTRATE THE POINT. Kamal runs
    # every deploy*.yml through ERB before YAML, comments included — a `#` is a YAML comment, not
    # an ERB one — so an example tag is EXECUTED. Writing one here while drafting this very
    # tombstone made `-d ovh` fail to load with `(erb):64: syntax errors found`, which is the same
    # class as CLAUDE.md §14d's rule about an ERB comment ending at its first terminator: describe
    # the wrong spelling in words.

    # Sidecar accessories run on the UNRAID host (see `accessories:` in deploy.yml, whose `host:` is
    # 192.168.1.95), so `tinkerex-boxes` / `tinkerex-openscad` do not resolve on this box. Kamal
    # DEEP-MERGES env.clear, so without these explicit blanks the overlay inherits the Unraid
    # hostnames, each addon reports configured? == true, and every call fails — strictly worse than
    # the addon greying out. Blank -> `configured?` is false -> "Unavailable here". Set these to a
    # real URL if a sidecar is ever booted on OVH.
    BOXES_SIDECAR_URL: ""
    OPENSCAD_SIDECAR_URL: ""

    # The addons accessory runs on the Unraid host too, so `tinkerex-addons` does not resolve here.
    # Blank -> the Rails app falls back to production.rb's ADDON_SOURCE_PATH default, which points at
    # public/addons — a directory Task 3 removes from the image. So OVH renders an EMPTY tools
    # gallery until it gets its own addons accessory. That degrades gracefully (Registry rescues to
    # []), it is not a 500, and it is the honest state: OVH has no addon host.
    ADDON_SOURCE_URL: ""

    # The `sync` accessory (Arc D Task 2) runs on the Unraid host too, so `tinkerex-sync` does not
    # resolve here either — same deep-merge trap, same fix. A future `chunk_remote` leg on OVH
    # would need its own real value here, never an inherited Unraid-only one.
    #
    # ⚠️ BLANKING IT IS NO LONGER SUFFICIENT, AND THIS IS THE OPEN DECISION FOR THIS DESTINATION.
    # This comment used to say "OVH never runs LIBRARY_BACKEND=chunk_remote", which was true while
    # the base was embedded `chunk` and a fourth `remote` destination carried chunk_remote. Arc D
    # Part 2 made the BASE chunk_remote, and this overlay declares no LIBRARY_BACKEND of its own —
    # so it now INHERITS chunk_remote, with this key blank and (see env.secret above) no
    # SYNC_ADMIN_TOKEN. LibraryBackendCheck refuses that at boot, naming both keys, so
    # `kamal deploy -d ovh` cannot bring a container up. Measured against the merged config, not
    # reasoned. (Nobody has inspected the container actually running on this box; it was very
    # likely deployed from a pre-Arc-D image and is fine until the next `-d ovh` deploy.)
    #
    # THE FIX IS TO DECLARE A LIBRARY_BACKEND THIS BOX CAN SATISFY, AND CHOOSING WHICH IS A PRODUCT
    # DECISION, NOT A CLEANUP. The three answers and what each actually costs:
    #   s3           — cheapest, and keeps every existing guard green. Needs LIBRARY_S3_BUCKET and
    #                  LIBRARY_S3_ACCESS_KEY_ID in clear plus LIBRARY_S3_SECRET_ACCESS_KEY in
    #                  env.secret (lib/library_backend_check.rb S3_REQUIRED), and a decision about
    #                  whether the library lives in a new R2 bucket or under a `library/` prefix in
    #                  maker-chunks-prod — deploy.s3.yml:8-11 is the precedent for the latter.
    #   share        — needs LIBRARY_PATH and a directory that EXISTS (check_share! probes it), so
    #                  it costs a second `volumes:` entry: this overlay declares none and inherits
    #                  only tinkerex_storage:/rails/storage.
    #   chunk_remote — needs a sync server ON OVH, a real URL here, SYNC_ADMIN_TOKEN back in
    #                  env.secret above, AND a revision of test/deploy_hygiene_test.rb's "the OVH
    #                  overlay clears every Unraid-host-only service URL" guard, which requires
    #                  this key BLANK precisely so an unreachable inherited hostname cannot report
    #                  itself as configured. Largest change; do not pick it to tidy this file.
    # Whichever is chosen, delete "ovh" from UNDECIDED_LIBRARY_BACKEND in test/deploy_hygiene_test.rb
    # — that guard asserts the exemption is still NEEDED, so it goes red if you forget.
    CHUNK_REMOTE_URL: ""

    # THE ONE INTERNET-FACING BOX, SO THE ONE THAT NEEDS TLS ENFORCEMENT (2026-07-30).
    #
    # production.rb gates assume_ssl + force_ssl + the /up redirect exclusion behind this flag
    # (see the audit's S1: before it, NEITHER was enabled anywhere, so this host had no HSTS and
    # its session cookie was sent on plain-HTTP requests to the same host). The Unraid overlays
    # deliberately leave it unset — they are reached by IP over plain HTTP on the LAN, where a
    # force_ssl redirect points at nothing.
    #
    # assume_ssl AND force_ssl TOGETHER is the safe pairing, not force_ssl alone: assume_ssl makes
    # Rails believe the terminating proxy's X-Forwarded-Proto, so it does not re-redirect a request
    # that already arrived over HTTPS. force_ssl on its own behind a proxy is the redirect-loop
    # configuration.
    #
    # VERIFY AFTER THE NEXT `kamal deploy -d ovh`: an http:// request should 301 to https, the
    # response should carry Strict-Transport-Security, the session cookie should be marked Secure,
    # and `kamal app exec 'curl -sS -o /dev/null -w "%{http_code}" http://localhost:3000/up'`
    # should still answer 200 (that is what the ssl_options exclusion protects).
    FORCE_SSL: "1"

    # ENABLE_TEST_SIGNUP IS INHERITED HERE, DELIBERATELY AND WITH EYES OPEN (2026-07-29).
    #
    # deploy.yml's env.clear sets ENABLE_TEST_SIGNUP: true, and Kamal DEEP-MERGES env.clear — the same
    # mechanism the two blank lines above exist to defeat. So this box, unlike the LAN-only Unraid one
    # the base comment justifies, serves POST /v1/test/users: an unverified signup that mints CONFIRMED
    # accounts, reachable by anyone who can reach the host.
    #
    # Accepted for now because this is a prod-LIKE TEST box, not the managed SaaS. Blanking it is one
    # line (`ENABLE_TEST_SIGNUP: ""`) beside the sidecar blanks above, and that is the fix the day this
    # box holds anything real. The boot warning fires either way
    # (config/initializers/test_signup_warning.rb).
    #
    # NOT blanked at the base instead, because the Unraid box needs it:
    # client/test-conformance/two-device-cfapi.ps1 enrolls against http://192.168.1.95 through this
    # seam. The other harnesses boot their own server and set the var themselves.
