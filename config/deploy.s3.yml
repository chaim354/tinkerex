# Kamal destination overlay: the S3-backed LIBRARY on the Unraid box (deep-merged over deploy.yml).
#   Deploy with:  kamal deploy -d s3
#
# Same image, same box (192.168.1.95) as the chunk deploy — this runs a SECOND container
# (tinkerex-web-s3, destination-namespaced) whose FileLayer is backed by the user's own S3
# bucket instead of the FastCDC chunk store. Current-state only: no versions/history/restore.
#
# Storage note: this reuses the SAME SeaweedFS bucket as chunk (my-bucket) under a distinct
# LIBRARY_S3_PREFIX (library/). The prefixes (chunks/ vs library/) are disjoint and are
# addressed by two different containers with different backends, so nothing walks both. It
# therefore reuses the chunk credentials (seaweednew) — no new bucket, no new secret to source.
#
# THERE IS NO CHUNK-STORE ENV TO NEUTRALISE ANY MORE. This header used to explain a
# STORAGE_BACKEND=memory line (the base declared STORAGE_BACKEND=s3 + CHUNK_*, and Kamal's
# deep_merge has no delete, so an inherited key could only be overridden). Arc D Part 2 removed
# that axis from the base and from this app entirely — see the tombstone in env.clear below.

# Two names — see the `proxy:` comment in deploy.yml for why `.home` exists beside `.local`
# (short version: `.local` is mDNS-reserved, so Apple devices never resolve it via DNS).
proxy:
  hosts:
    - s3.tinkerex.local
    - s3.tinkerex.home

# A destination-scoped volume — the base's shared "tinkerex_storage" would put three
# containers on ONE SQLite database. Each backend gets its own.
volumes:
  - "tinkerex_storage_s3:/rails/storage"

env:
  # env.secret is an ARRAY: Kamal REPLACES it wholesale (deep_merge unions hashes, replaces
  # arrays), so RAILS_MASTER_KEY must be re-listed or boot dies with "Missing secret_key_base".
  # LIBRARY_S3_SECRET_ACCESS_KEY is defined in .kamal/secrets.s3 (= the seaweednew secret), NOT in
  # secrets-common, and that placement is load-bearing: .kamal/secrets.ovh resolves the SAME NAME to
  # the R2 credential for its own s3 library. One variable, two backends — a shared definition could
  # not tell them apart, and the loser signs with InvalidAccessKeyId (§14g).
  secret:
    - RAILS_MASTER_KEY
    - LIBRARY_S3_SECRET_ACCESS_KEY
  clear:
    # STORAGE_BACKEND: memory WAS HERE to neutralise the chunk-store env inherited from
    # deploy.yml, which Kamal's deep_merge cannot delete. That env is gone (Arc D Part 2)
    # and nothing in this app reads the name any more, so there is nothing to neutralise.
    LIBRARY_BACKEND: s3
    # Mail links carry this name (deploy.yml explains); must be one of the proxy hosts above.
    APP_HOST: s3.tinkerex.home
    # 192.168.1.2, NOT .8, AND THE DIFFERENCE IS A WHOLE BACKEND. SeaweedFS is the `miniweeed`
    # container on Unraid's `br0`, a MACVLAN network whose IPAM allocates in container start order
    # and never consults DHCP, so the 2026-08-17 reboot moved it from .8 to .2 and put Redis on .8.
    # tinkerex#85 fixed the chunk store's CHUNK_ENDPOINT and pinned the container's address
    # (`IPAMConfig.ipv4_address`), but this overlay kept .8 because "share and s3 do not use
    # CHUNK_*" — true, and beside the point: this is the SAME host. Every S3 call from this
    # deployment refused the connection until 2026-09-06, so the catalog stayed empty and there was
    # nothing for a preview to fail on. Probe before "correcting" it back:
    # `curl -sI http://192.168.1.2:8333/` answers `Server: SeaweedFS ...`; `.8:8333` refuses.
    # The store also has to KNOW this deployment's identity — docs/DEPLOY.md, "bucket CORS".
    LIBRARY_S3_ENDPOINT: http://192.168.1.2:8333
    LIBRARY_S3_BUCKET: my-bucket
    LIBRARY_S3_PREFIX: library/
    LIBRARY_S3_REGION: us-east-1
    # Same SeaweedFS identity as CHUNK_ACCESS_KEY_ID (seaweednew). Not a secret — the ID is
    # already in git in deploy.yml; only the secret key is shell/1Password-sourced.
    LIBRARY_S3_ACCESS_KEY_ID: 2ER1TJXNXU15ECJ3YRQK
    # Box Generator sidecar (the one `boxes` accessory booted by the default config), shared across
    # all three app deployments on this host via the kamal network.
    BOXES_SIDECAR_URL: http://tinkerex-boxes:8000
