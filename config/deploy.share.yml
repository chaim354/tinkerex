# Kamal destination overlay: the SHARE-backed LIBRARY on the Unraid box (deep-merged over deploy.yml).
#   Deploy with:  kamal deploy -d share
#
# Same image, same box (192.168.1.95) as the chunk deploy — a THIRD container
# (tinkerex-web-share) whose FileLayer is backed by a mounted DIRECTORY instead of the chunk
# store. Current-state only: no versions/history/restore. The library streams bytes THROUGH
# Rails (a mounted dir has nothing to presign) — the one place §15 deliberately does not hold.
#
# The library is the Unraid host's "3D Printing" SMB share (host 192.168.1.146, guest/no-auth),
# surfaced into the container via a Docker CIFS volume rather than a host mount — so no
# host-level `sudo mount`, no cifs-utils, no fstab. The one host prerequisite is the `cifs`
# KERNEL module being loaded (`/etc/modules-load.d/cifs.conf`; Docker's cifs volume mounts via
# the kernel at container start). uid/gid 1000 so the container user can read AND write (the
# boot guard write-probes, and deletes move files into a .trash/ folder inside the share).
#
# STORAGE_BACKEND=memory neutralizes the chunk-store env inherited from deploy.yml (see the
# note in deploy.s3.yml). A share deployment needs no chunk store and no S3 credentials at all.

# Two names — see the `proxy:` comment in deploy.yml for why `.home` exists beside `.local`
# (short version: `.local` is mDNS-reserved, so Apple devices never resolve it via DNS).
proxy:
  hosts:
    - share.tinkerex.local
    - share.tinkerex.home

# Destination-scoped SQLite volume, PLUS the CIFS library volume at /library (where LIBRARY_PATH
# points). The CIFS volume is created out-of-band on the box (Kamal only ensures it EXISTS; if it
# were ever removed, Kamal would recreate it as a PLAIN empty local volume — so do not delete it):
#   docker volume create --driver local --opt type=cifs \
#     --opt device="//192.168.1.146/3D Printing" \
#     --opt o="guest,uid=1000,gid=1000,vers=3.0,file_mode=0664,dir_mode=0775" \
#     tinkerex_library_3dprinting
volumes:
  - "tinkerex_storage_share:/rails/storage"
  - "tinkerex_library_3dprinting:/library"

env:
  # Redeclared to DROP the inherited CHUNK_SECRET_ACCESS_KEY — a share container holds no
  # storage credential. RAILS_MASTER_KEY must stay or boot dies with "Missing secret_key_base".
  secret:
    - RAILS_MASTER_KEY
  clear:
    STORAGE_BACKEND: memory
    LIBRARY_BACKEND: share
    LIBRARY_PATH: /library
    # Box Generator sidecar (the one `boxes` accessory booted by the default config), shared across
    # all three app deployments on this host via the kamal network.
    BOXES_SIDECAR_URL: http://tinkerex-boxes:8000
