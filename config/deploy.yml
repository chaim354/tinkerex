# Name of your application. Used to uniquely configure containers.
service: tinkerex

# Name of the container image. On ghcr this is <github-user>/<app> → ghcr.io/chaim354/tinkerex.
image: chaim354/tinkerex

# Deploy to these servers.
servers:
  web:
    - 192.168.1.95
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Deploy as the kamal1 user (not root). Needs Docker access + sudo for `kamal setup`.
ssh:
  user: kamal1

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb!
#
# Don't use this when deploying to multiple web servers (then you have to terminate SSL at your load balancer).
#
# Host-routed: three LIBRARY_BACKEND deployments (chunk here, plus `-d s3` and `-d share`) share
# this one box and one kamal-proxy. Each destination registers a DISTINCT hostname; without a
# host, three catch-alls would collide and the last deploy would silently win. Add to /etc/hosts
# on any client that will reach them:
#   192.168.1.95  chunk.tinkerex.local s3.tinkerex.local share.tinkerex.local
# NOTE: once this host is set, the bare IP (http://192.168.1.95) no longer routes to chunk —
# use http://chunk.tinkerex.local.
proxy:
  host: chunk.tinkerex.local

# Shared container registry: GitHub Container Registry (ghcr.io). The Mac builds the
# image once and pushes here; both servers (Unraid + OVH) pull the same image. Auth is a
# GitHub token with `packages` scope, sourced from the shell via .kamal/secrets (never in
# git). The image package inherits the repo's visibility (private) — servers pull with the
# same token (read:packages). See docs/DEPLOY.md.
registry:
  server: ghcr.io
  username: chaim354
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    # SeaweedFS S3 secret key — sourced from ENV in .kamal/secrets (never committed).
    - CHUNK_SECRET_ACCESS_KEY
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # Opens the POST /v1/test/users signup seam so the automated E2E tests + dev can enroll
    # accounts against THIS box. SAFE here: this Unraid instance is a NON-production test/dev
    # deploy (despite running as RAILS_ENV=production for deploy reasons). The seam creates
    # unverified confirmed accounts, so NEVER set this on the managed SaaS production. A boot
    # warning fires whenever it's on (config/initializers/test_signup_warning.rb).
    ENABLE_TEST_SIGNUP: true

    # --- Chunk storage (object store). Bytes move client ⇄ storage via presigned URLs
    # the server mints (local HMAC signing). Clients hit CHUNK_ENDPOINT directly, so it
    # must be reachable from each client device. Set STORAGE_BACKEND=memory for a
    # control-plane-only smoke test.
    #
    # NOTE: the server ALSO needs to reach CHUNK_ENDPOINT now — verify-on-finalize
    # (config.x.verify_finalize, on by default) does an exists?-check that the chunk bytes
    # actually landed before creating the version. Signing alone no longer suffices. If the
    # store is unreachable from the server, commits fail loudly rather than creating versions
    # pointing at bytes that never arrived. Set SYNC_VERIFY_FINALIZE=0 to opt out.
    STORAGE_BACKEND: s3
    CHUNK_ENDPOINT: http://192.168.1.8:8333
    CHUNK_BUCKET: my-bucket
    CHUNK_REGION: us-east-1
    # Authoritative source = 1Password item "seaweednew" (op://Personal/seaweednew/access key).
    # The secret is sourced from the SAME item in .kamal/secrets — keep them together or you
    # get InvalidAccessKeyId.
    #
    # The older "seaweedfs" item belongs to the RETIRED instance at 192.168.1.7 (port now
    # closed). Its identity does not exist on the current server, so signing with it fails the
    # client's presigned PUT with InvalidAccessKeyId — which is how this was found.
    CHUNK_ACCESS_KEY_ID: 2ER1TJXNXU15ECJ3YRQK

    # The Box Generator addon's Python sidecar (the `boxes` accessory below), reachable by its
    # container name on the shared kamal docker network. Internal-only; never published. Unset ->
    # the addon shows as unavailable (graceful). All three app deployments share the one accessory.
    BOXES_SIDECAR_URL: http://tinkerex-boxes:8000

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use tinkerex-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "tinkerex_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets


# Configure the image builder. Both target servers (Unraid + OVH) are amd64; the Mac control
# machine is arm64, so Kamal uses buildx to cross-build amd64 (QEMU emulation) ON THE MAC and
# push to ghcr — both servers then pull the same image. Measured cold build ~84 s (incremental
# deploys hit the gem/apt layer cache and are far faster), so no remote/on-box builder is needed.
# A fat build context kills this — keep client/, docs/, test/, .claude/ out via .dockerignore.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.4.7
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Accessory services (booted with `kamal accessory boot boxes`). The boxes sidecar is the forked
# boxes.py Python service (sidecar/boxes) — a SEPARATE, GPL-3.0 image built + pushed separately from
# the Rails app (see docs/DEPLOY.md). NO `port:` -> internal-only, reachable on the kamal network as
# `tinkerex-boxes`; the app's BOXES_SIDECAR_URL points at it. One accessory serves all three app
# deployments on this host.
accessories:
  boxes:
    image: ghcr.io/chaim354/boxes-sidecar:latest
    host: 192.168.1.95

