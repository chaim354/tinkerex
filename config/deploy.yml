# Name of your application. Used to uniquely configure containers.
service: tinkerex

# Name of the container image. On ghcr this is <github-user>/<app> → ghcr.io/chaim354/tinkerex.
image: chaim354/tinkerex

# Deploy to these servers.
servers:
  web:
    - 192.168.1.95
  # job:
  #   hosts:
  #     - 192.168.0.1
  #   cmd: bin/jobs

# Deploy as the kamal1 user (not root). Needs Docker access + sudo for `kamal setup`.
ssh:
  user: kamal1

# Enable SSL auto certification via Let's Encrypt and allow for multiple apps on a single web server.
# If used with Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
#
# Using an SSL proxy like this requires turning on config.assume_ssl and config.force_ssl in production.rb!
#
# Don't use this when deploying to multiple web servers (then you have to terminate SSL at your load balancer).
#
# Host-routed: three LIBRARY_BACKEND deployments (chunk here, plus `-d s3` and `-d share`) share
# this one box and one kamal-proxy. Each destination registers DISTINCT hostnames; without a
# host, three catch-alls would collide and the last deploy would silently win. Add to /etc/hosts
# on any client that will reach them (sync.tinkerex.local is the sync accessory's device door --
# `accessories: sync: proxy:` below -- and follows every rule in this comment):
#   192.168.1.95  chunk.tinkerex.local s3.tinkerex.local share.tinkerex.local sync.tinkerex.local
# NOTE: once this host is set, the bare IP (http://192.168.1.95) no longer routes to chunk —
# use http://chunk.tinkerex.local.
#
# TWO NAMES PER DEPLOYMENT, AND THE SECOND ONE IS NOT COSMETIC. `.local` is reserved for mDNS
# (RFC 6762): macOS and iOS resolve it through Bonjour and NEVER send it to the configured
# resolver, so a DNS rewrite for a `.local` name in AdGuard (or any other resolver) is silently
# ignored on exactly the devices that cannot edit /etc/hosts. `.home` is not mDNS-hijacked, so it
# is resolvable by a normal DNS server — which is what makes these reachable over Tailscale from
# a phone. Both names are kept: `.local` + /etc/hosts is what every existing client already uses,
# and dropping it would break them at the same moment.
#
# `proxy.hosts` (plural) is a list; kamal reads `proxy_config["hosts"] || proxy_config["host"]
# &.split(",")`, so this is the supported spelling and not a comma-string hack. ALL FOUR FILES MUST
# USE THE SAME SPELLING: kamal deep-merges the overlay over this file and then REFUSES a merged
# proxy carrying both keys ("Specify one of 'host' or 'hosts', not both"), so leaving one overlay on
# singular `host:` breaks that destination's deploy outright. Loud, not silent — but it means the
# migration cannot be done one file at a time.
#
# `hosts` is an ARRAY, and kamal's deep_merge REPLACES arrays (it unions hashes only — the same
# asymmetry deploy.s3.yml's env.secret comment describes). That replacement is what keeps the three
# destinations from inheriting each other's names; if it ever unioned, every overlay would also
# answer to chunk's names. `test/deploy_hygiene_test.rb` asserts the MERGED result for that reason.
#
# Each name must be registered HERE or kamal-proxy 404s it — including a name a front proxy
# (nginx/NPM) forwards, since it passes the original Host through. Adding a name to this list is
# inert until that destination is redeployed.
proxy:
  hosts:
    - chunk.tinkerex.local
    - chunk.tinkerex.home

# Shared container registry: GitHub Container Registry (ghcr.io). The Mac builds the
# image once and pushes here; both servers (Unraid + OVH) pull the same image. Auth is a
# GitHub token with `packages` scope, sourced from the shell via .kamal/secrets (never in
# git). The image package inherits the repo's visibility (private) — servers pull with the
# same token (read:packages). See docs/DEPLOY.md.
registry:
  server: ghcr.io
  username: chaim354
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    # REQUIRED BY THE BASE DESTINATION NOW THAT IT IS chunk_remote: FileLayer::ChunkRemote
    # provisions each maker user their own remote library through POST /v1/admin/libraries, gated
    # by this operator credential (§8). LibraryBackendCheck refuses to boot without it, so a
    # missing value fails loudly at start rather than on the first library write.
    #
    # BOTH SIDES MUST RESOLVE THE SAME 1PASSWORD ITEM -- this app SENDS it and the `sync` accessory
    # RECEIVES it -- or the far side answers 503. That shared reference is what guarantees the
    # match; see .kamal/secrets and the accessory's own comment.
    - SYNC_ADMIN_TOKEN
    # SeaweedFS S3 secret key — sourced from ENV in .kamal/secrets (never committed).
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # THE WEB POOL MUST BE BIGGER THAN THE NUMBER OF CONCURRENT SLOW PROXY CALLS, and the stock
    # value was not. config/puma.rb defaults to `threads 3, 3` via RAILS_MAX_THREADS, and this file
    # never set it — so production ran THREE web threads in the one process that also hosts the
    # Solid Queue supervisor (above), against synchronous sidecar calls held open for up to
    # Maker::Addons::ServiceProxy::READ_TIMEOUT (30 s), or a manifest's own `service_timeouts` entry
    # capped by ADDON_SERVICE_MAX_TIMEOUT (default 120 s) — openscad's bundle asks for 90. The
    # boxes bundle fires a proxied render on a 600 ms debounce per parameter drag, and the
    # browser's AbortController frees the BROWSER, not the Rails thread — so three users dragging
    # sliders could consume the entire pool and queue everything behind them, including the v1 sync
    # control plane. There is no reentrancy deadlock (sidecars never call back, and Phase B serves
    # bundle assets from the addons accessory, not from this process), so the failure mode is
    # starvation rather than deadlock — which is exactly why it degrades quietly instead of erroring.
    #
    # 16 is the value §14e already validated in development for the same class of problem (several
    # near-simultaneous addon asset requests against the stock 3-thread pool, which intermittently
    # 404'd until RAILS_MAX_THREADS=16). This is the cheapest of the three fixes the audit lists;
    # the other two — per-endpoint proxy timeouts and moving renders to a job with a polled result —
    # remain the real answer for SaaS scale, since a thread count only raises the ceiling.
    RAILS_MAX_THREADS: 16

    # THE HOST MAIL LINKS ARE BUILT FROM (config/environments/production.rb). Confirmation and
    # password-reset links carry this name; the fallback there is a loud `.invalid`, and until
    # 2026-10-12 every destination shipped that fallback because none set this. Each overlay sets
    # its own, and test/deploy_hygiene_test.rb requires the name to be one kamal-proxy routes for
    # that destination. `.home` rather than `.local`: it resolves from every client on the LAN and
    # the tailnet (*.tinkerex.home is a wildcard to the NPM front proxy), `.local` only where an
    # /etc/hosts line was added by hand.
    APP_HOST: chunk.tinkerex.home
    # REGISTRATION is not set: closed is the production default (lib/tinkerex/registration.rb); the first account is the owner.

    # THE TEST-SIGNUP SEAM IS NOT SET HERE, OR IN ANY DESTINATION (2026-10-12). POST /v1/test/users
    # mints confirmed accounts with no email check and no throttle, and env.clear deep-merges into
    # every overlay -- the internet-facing OVH box inherited it for two months. A harness run that
    # needs it exports ENABLE_TEST_SIGNUP=1 for that run only (`kamal env push`, or a local
    # `bin/rails server`); test/deploy_hygiene_test.rb refuses any committed destination that sets it.

    # THE EMBEDDED CHUNK STORE'S ENV IS GONE (Arc D Part 2). STORAGE_BACKEND, CHUNK_ENDPOINT,
    # CHUNK_BUCKET, CHUNK_REGION and CHUNK_ACCESS_KEY_ID configured Sync::Storage::ChunkStore,
    # which shipped inside the sync engine gem. This app does not load that gem any more and NO
    # CODE HERE READS ANY OF THOSE NAMES -- checked by grep across app/, lib/, config/ and bin/,
    # not assumed. The library's bytes live on the `sync` accessory's own volume now, reached over
    # CHUNK_REMOTE_URL below.
    #
    # This also removes the reason deploy.share.yml and deploy.s3.yml carried STORAGE_BACKEND:
    # memory. Kamal's deep_merge has no delete, so those overlays could not remove the base's
    # chunk-store env and NEUTRALISED it instead; with nothing to neutralise, that line goes too.
    # The Box Generator addon's Python sidecar (the `boxes` accessory below), reachable by its
    # container name on the shared kamal docker network. Internal-only; never published. Unset ->
    # the addon shows as unavailable (graceful). All three app deployments share the one accessory.
    BOXES_SIDECAR_URL: http://tinkerex-boxes:8000

    # The OpenSCAD addon's sidecar (the `openscad` accessory below). Internal-only; never published.
    # Unset or blank -> the addon shows as unavailable (graceful). All three app deployments share
    # the one accessory. NOTE: deploy.ovh.yml must blank this — Kamal deep-merges env.clear, so the
    # OVH box would otherwise inherit a hostname that does not resolve there and every call would
    # fail instead of the addon greying out (spec §8.1; guarded by test/deploy_hygiene_test.rb).
    OPENSCAD_SIDECAR_URL: http://tinkerex-openscad:8000

    # The addon bundle host (the `addons` accessory below, repo chaim354/tinkerex-addons). Takes
    # precedence over ADDON_SOURCE_PATH's on-disk fallback (config/environments/production.rb).
    # Internal-only; never published. NOTE: deploy.ovh.yml must blank this — same deep-merge trap as
    # the two sidecar URLs above (guarded by test/deploy_hygiene_test.rb).
    ADDON_SOURCE_URL: http://tinkerex-addons

    # The standalone sync server (the `sync` accessory below, repo chaim354/tinkerex-sync) — Arc D
    # Task 2. Feeds ONLY the `remote` destination's LIBRARY_BACKEND=chunk_remote
    # (config/deploy.remote.yml, FileLayer::ChunkRemote); chunk/share/s3 never call that door, so this
    # is inert env on those three — the same shape as the sidecar/addon URLs above being inert on any
    # deployment that never opens their tool. Declared HERE (rather than only in deploy.remote.yml) for
    # the same reason the ovh-blanking test needs it to be: that guard reads Unraid-host-only URLs off
    # THIS file's env.clear (test/deploy_hygiene_test.rb), so a key that lives only in an overlay is
    # invisible to it. Internal-only; never published. NOTE: deploy.ovh.yml must blank this — same
    # deep-merge trap as the three URLs above (guarded by test/deploy_hygiene_test.rb, pattern widened
    # for this key in the same commit that added it, mirroring how ADDON_SOURCE_URL itself joined the
    # pattern late — CLAUDE.md §14c). Port :3000, not the bare hostname a first draft might reach for:
    # the accessory's image EXPOSEs and binds 3000 (chaim354/tinkerex-sync's own Dockerfile; that
    # repo's own currently-unused standalone deploy.yml independently confirms it via `app_port:
    # 3000`) — unlike ADDON_SOURCE_URL above, whose target is an nginx image on the HTTP default.
    # THE BASE DESTINATION IS THE CHUNK-FAMILY ONE AGAIN, and it is `chunk_remote`. It used to be
    # embedded `chunk` and there was a FOURTH destination, `remote`, carrying chunk_remote beside
    # it (config/deploy.remote.yml, now deleted). Arc D Part 2 retired embedded chunk, so the base
    # cannot keep naming it -- and folding remote into base restores exactly three Unraid
    # destinations, which means a bare "deploy" covers the chunk-family box again rather than
    # leaving it to drift, the cost §7 had to name when it was excluded.
    LIBRARY_BACKEND: chunk_remote
    CHUNK_REMOTE_URL: http://tinkerex-sync:3000
    # THE SAME SERVER AS DEVICES REACH IT, handed to every desktop app that signs in (D1). Not the
    # alias above, which only the kamal network resolves: the two addresses differ on purpose. It
    # is the `sync` accessory's own door (its proxy.hosts below, the .home name), plain HTTP like
    # that door; test/deploy_hygiene_test.rb derives both from it. Every overlay inherits it, and
    # only chunk_remote reads it.
    SYNC_PUBLIC_URL: http://sync.tinkerex.home

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Match this to any external database server to configure Active Record correctly
    # Use tinkerex-db for a db accessory server on same machine via local kamal docker network.
    # DB_HOST: 192.168.0.2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Use a persistent storage volume for sqlite database files and local Active Storage files.
# Recommended to change this to a mounted volume path that is backed up off server.
volumes:
  - "tinkerex_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets


# Configure the image builder. Both target servers (Unraid + OVH) are amd64; the Mac control
# machine is arm64, so Kamal uses buildx to cross-build amd64 (QEMU emulation) ON THE MAC and
# push to ghcr — both servers then pull the same image. Measured cold build ~84 s (incremental
# deploys hit the gem/apt layer cache and are far faster), so no remote/on-box builder is needed.
# A fat build context kills this — keep client/, docs/, test/, .claude/ out via .dockerignore.
builder:
  arch: amd64

  # `secrets:` WAS HERE, holding TINKEREX_SYNC_DEPLOY_KEY alone -- the read-only key the build
  # used to fetch the private sync-engine gem. With that gem gone (Arc D Part 2) the list was
  # empty, and an empty `secrets:` is not the same as no `secrets:`: kamal reads it as nil and
  # refuses the whole config with "builder/secrets: should be an array" -- caught by
  # bin/secrets-preflight, which is exactly the class of silent-empty this repo keeps it for.

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.4.7
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Accessory services (booted with `kamal accessory boot boxes`). The boxes sidecar is the forked
# boxes.py Python service (sidecar/boxes) — a SEPARATE, GPL-3.0 image built + pushed separately from
# the Rails app (see docs/DEPLOY.md). NO `port:` -> internal-only, reachable on the kamal network as
# `tinkerex-boxes`; the app's BOXES_SIDECAR_URL points at it. One accessory serves all three app
# deployments on this host.
accessories:
  boxes:
    image: ghcr.io/chaim354/boxes-sidecar:latest
    host: 192.168.1.95

  # The OpenSCAD addon's sidecar (sidecar/openscad) — a SEPARATE GPL-2.0 image, built + pushed with
  # bin/build-openscad-sidecar. NO `port:` -> internal-only, reachable on the kamal network as
  # `tinkerex-openscad`. One accessory serves all three app deployments on this host.
  openscad:
    image: ghcr.io/chaim354/openscad-sidecar:latest
    host: 192.168.1.95
    volumes:
      # The content-addressed render cache. On a volume so it survives an accessory reboot —
      # a cold cache just means the first render of each design pays full price.
      - openscad-cache:/cache

  # The addon bundle host (repo: chaim354/tinkerex-addons) — a tiny nginx image serving each addon's
  # manifest + plain-ESM bundle. NO `port:` -> internal-only, reachable on the Kamal network as
  # `tinkerex-addons`, exactly like the two sidecars. THIS ACCESSORY IS WHY ADDON CHANGES DO NOT NEED
  # A RAILS DEPLOY: rebuild + push from that repo, `kamal accessory reboot addons`, done.
  addons:
    image: ghcr.io/chaim354/tinkerex-addons:latest
    host: 192.168.1.95

  # The standalone sync server (repo: chaim354/tinkerex-sync) — Arc D Task 2
  # (docs/superpowers/plans/2026-08-25-arc-d-part-1-a-real-remote-deployment.md). Reachable on the
  # Kamal network as `tinkerex-sync` — the MAKER APP's door (CHUNK_REMOTE_URL above) — and, since
  # 2026-10-07, through kamal-proxy as sync.tinkerex.{local,home} — the DEVICES' door (the `proxy:`
  # block below). Still NO `port:`, like the three accessories above. Unlike them, only ONE app
  # deployment talks to it: the BASE destination, which carries LIBRARY_BACKEND=chunk_remote since
  # Arc D Part 2 folded the old `remote` overlay into it. share/s3 never open this door; ovh
  # declares no backend at all (see deploy.ovh.yml).
  #
  # STORAGE_BACKEND=local: chunk bytes AND this host's own SQLite catalog both live on the volume
  # below, so it needs no SeaweedFS/S3 credential of its own (unlike the maker app's `s3`
  # leg) — a first deployment works with nothing else standing, matching that repo's own Dockerfile
  # comment. CABLE_ADAPTER=async because this is ONE container; a second would need Redis, or devices
  # attached to one would never hear the other's broadcasts (host/config/cable.yml over there).
  #
  # SINCE THE CUTOVER OF 2026-10-07 THE IMAGE IS THE RUST BINARY (`crates/tinkerex-sync` in that
  # repo; `:latest` is `:<sha>-rust`, the rollback target is `:ruby-4148fcd6…`, the plan is
  # docs/superpowers/plans/2026-10-07-rust-cutover.md there). It reads STORAGE_BACKEND,
  # CHUNK_LOCAL_DIR, SECRET_KEY_BASE and SYNC_ADMIN_TOKEN under the same names and IGNORES
  # CABLE_ADAPTER and RAILS_LOG_TO_STDOUT — the two sentences above describe the previous image.
  # Both lines stay until that plan's §9 retires the Ruby image: the rollback target still reads
  # them. Its own Dockerfile already defaults CHUNK_LOCAL_DIR to the volume path, so the line below
  # is belt-and-braces on Rust and load-bearing for the rollback.
  #
  # SECRET_KEY_BASE and SYNC_ADMIN_TOKEN are THIS ACCESSORY's own env, resolved through Kamal like any
  # other secret — but they end up referenced from DIFFERENT files, and that split is deliberate, not
  # an inconsistency. `accessories:` here is never overridden by ANY destination overlay, so BOTH keys
  # are structurally required by every destination's merged config (verified against
  # Kamal::Configuration.raw_config for all four, not assumed — five until `remote` folded into the
  # base; test/deploy_hygiene_test.rb re-derives it every run) — exactly the shape
  # TINKEREX_SYNC_DEPLOY_KEY already has via `builder:`, which is the same kind of never-overlaid
  # block. SECRET_KEY_BASE has ONLY that one consumer (this accessory's own Rails boot), so it follows
  # TINKEREX_SYNC_DEPLOY_KEY straight into `.kamal/secrets-common` (see the comment there). SYNC_ADMIN_TOKEN
  # does NOT, on explicit instruction (§14g) — it also has a genuine per-destination story, since only
  # the BASE destination's maker app additionally SENDS it (it is the chunk_remote one) — so it is
  # instead repeated across every per-destination secrets file (.kamal/secrets, .kamal/secrets.share,
  # .kamal/secrets.s3, .kamal/secrets.ovh). `.kamal/secrets.remote` was a fifth and is gone with the
  # overlay it belonged to; THIS comment is the fullest statement of the argument now.
  #
  # SYNC_ADMIN_TOKEN must resolve to the IDENTICAL value the maker app's own copy resolves to
  # (the base destination: config/deploy.yml's env.secret + .kamal/secrets) — both read the SAME item
  # (op://tinkerex/tinkerex-sync-admin-token/password). That shared reference is what GUARANTEES the
  # match; a divergent value here would make FileLayer::ChunkRemote::Provisioning's admin call 503
  # against Sync::V1::Admin::LibrariesController#authenticate_admin! on the far side (chaim354/
  # tinkerex-sync, admin/libraries_controller.rb — read directly, not assumed, per that class's own
  # comment). SECRET_KEY_BASE reuses the item already provisioned for this repo's own image testing
  # (op://tinkerex/tinkerex-sync/secret key base, created 2026-08-03) rather than minting a second one.
  sync:
    image: ghcr.io/chaim354/tinkerex-sync:latest
    host: 192.168.1.95
    # A DOOR FOR DEVICES (chaim354/tinkerex-sync docs/superpowers/plans/2026-10-07-rust-cutover.md
    # §2.2, decision D1). Until this block the accessory declared no `port:` and no `proxy:`, so the
    # sync server was internal-only: reachable from the maker app's container as
    # http://tinkerex-sync:3000 and from NOTHING else. No desktop client could sync against
    # production at all, and the client repo's scripts still pointed devices at http://192.168.1.95,
    # which has not served the sync endpoints (/v1/changes, /v1/commit, /v1/chunks/*, …) since
    # 2026-08-25 (CLAUDE.md §6; its remaining /v1/* is device login and the maker API). kamal 2.12
    # accepts `proxy:` on an accessory (lib/kamal/configuration/accessory.rb `running_proxy?`): boot
    # and start register the container with kamal-proxy, stop deregisters it, and the keys are the
    # app's own. A `proxy:` BLOCK ADDED TO AN ACCESSORY THAT IS ALREADY RUNNING IS DEPLOYED WITH
    # `start`, NEVER `reboot` -- measured 2026-10-07, the day this block landed: `reboot` runs `stop`
    # first, `stop` now deregisters a proxied accessory with `kamal-proxy remove tinkerex-sync`, and
    # for a service that has never been registered that answers "service not found", so SSHKit
    # aborted AFTER `docker container stop` and BEFORE remove_container/boot. The sync server sat
    # stopped for about a minute until `bin/kamal accessory start sync` started the same container
    # and ran `kamal-proxy deploy` for it. Once the service exists, `reboot` works (its remove
    # succeeds), and that is the ordinary roll command again. `boot` is no help for either case: it
    # skips any host whose container already exists, and the proxy registration is skipped with it.
    #
    # TWO NAMES, for the reasons the header comment gives the app roles — `.local` is what every
    # /etc/hosts client reaches, `.home` is what a phone over Tailscale reaches — and the same
    # one-box-one-proxy rule: a name registered by two services is silently won by the last deploy
    # (test/deploy_hygiene_test.rb asserts the accessory's names collide with no destination's).
    # Publishing the names is outside this repo: docs/DEPLOY.md §4.
    #
    # STILL NO `port:`. Publishing 3000 on the host would bypass the proxy and its Host routing; the
    # proxy is the one door. What stands behind it is gated by design: the v1 API by device token,
    # the admin door by SYNC_ADMIN_TOKEN; the anonymous share-link redeem becomes reachable, which is
    # its purpose. The maker app keeps using http://tinkerex-sync:3000 — this door is for devices.
    proxy:
      ssl: false
      hosts:
        - sync.tinkerex.local
        - sync.tinkerex.home
      app_port: 3000
      healthcheck:
        path: /up
        interval: 5
    env:
      clear:
        STORAGE_BACKEND: local
        CABLE_ADAPTER: async
        RAILS_LOG_TO_STDOUT: "1"
        # WITHOUT THIS LINE EVERY CHUNK BYTE IN THE LIBRARY IS DESTROYED BY ANY CONTAINER
        # REPLACEMENT, AND THE CATALOG SURVIVES TO GO ON CLAIMING THE FILES EXIST.
        #
        # In the Ruby image — what ran until 2026-10-07, and the rollback target —
        # Sync::Storage::LocalChunkStore defaults to `Rails.root.join("tmp", "chunk-store")` —
        # `/rails/host/tmp/chunk-store`, which is the container's EPHEMERAL layer, not the volume
        # mounted below. So a `kamal accessory reboot sync`, an image bump, or any redeploy took
        # the bytes with it while `versions`/`manifest_chunks`/`chunks` sat safely on the volume
        # still resolving every file to content that no longer existed. Silent: nothing errors at
        # reboot, and the failure only appears later, per file, on read.
        #
        # MEASURED, NOT REASONED (2026-08-24). The comment below used to assert that the volume held
        # "both the SQLite catalog AND every chunk byte". That was written from the design rather
        # than from the box and was simply FALSE — probed by finding the two-box proof's own chunk
        # at /rails/host/tmp/chunk-store/chunks/3/d6d45e31… while `docker inspect` listed exactly
        # one mount, /rails/host/storage. It surfaced only because Arc D Task 3's backup rehearsal
        # printed `chunk bytes (files) 0` next to `chunks 1`; no amount of re-reading this file
        # would have found it, which is CLAUDE.md §14e's probe-over-argument rule paying out again.
        #
        # UNDER THE STORAGE VOLUME RATHER THAN A SECOND VOLUME OF ITS OWN, DELIBERATELY. Two
        # volumes could be captured by two archives, and a catalog restored to a different instant
        # than its bytes is a library that resolves versions to chunks the store does not have —
        # the exact corruption content-addressing exists to make impossible. One volume means
        # ops/backup-db.sh's single `sync` archive holds the catalog and the bytes it references,
        # taken together, and `bin/restore-db sync` puts both back at one point in time.
        CHUNK_LOCAL_DIR: /rails/host/storage/chunk-store
        # THE BINARY'S OWN MAINTENANCE, ON — D3 of the cutover plan named above. `tinkerex-sync
        # serve` runs it only when this is set, and it was set only after the watch week's dry-runs:
        # on 2026-10-14 `gc reap-pending`, `gc reap-storage` and `gc retention` (each --dry-run) read
        # 0 / 0 / 0. Retention is keep_all, so the nightly pass (03:15 UTC) prunes no version; what
        # the scheduler deletes is orphaned BYTES — the chunks of a pending commit that expired
        # unfinalized (hourly, at :30) and store objects no row names (Sundays, 04:15 UTC). First
        # run: the :30 after the reboot that applies this line; the proof is the next morning's
        # `bin/kamal accessory logs sync --since 24h --grep reap-pending` (each tick logs
        # `scheduler: job done`). The Ruby rollback image ignores it — that host never ran these jobs.
        SYNC_SCHEDULER: "true"
      secret:
        - SECRET_KEY_BASE
        - SYNC_ADMIN_TOKEN
    # THE LIBRARY, NOT A CACHE — with STORAGE_BACKEND=local plus the CHUNK_LOCAL_DIR above, this
    # volume holds both the SQLite catalog and every chunk byte; losing it loses the files. (Read
    # that env comment before trusting this sentence: it was true of the DESIGN and false of the
    # BOX until 2026-08-24, and it is the line that has to be re-checked if CHUNK_LOCAL_DIR ever
    # moves.) Matches the path the image's own Dockerfile creates (`host/storage`) and the volume
    # name chaim354/tinkerex-sync's own (currently unused) standalone deploy.yml already chose, so
    # the name stays recognizable if that alternate deployment shape is ever revisited instead of
    # this accessory.
    volumes:
      - "tinkerex_sync_storage:/rails/host/storage"

