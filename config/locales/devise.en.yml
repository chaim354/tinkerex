# Devise's strings, in the app's notice voice (UX audit F4, B7): a notice is verb-first, past tense
# and ends with a full stop ("Signed in."), an alert says what to do next, and "sign in" is the one
# spelling, never "log in". The keys are Devise's own (https://github.com/heartcombo/devise/wiki/I18n).
#
# TWO PAIRS MUST STAY WORD FOR WORD IDENTICAL, because config.paranoid makes Devise answer an unknown
# address exactly as it answers a known one (account_enumeration_test.rb): failure.invalid and
# failure.not_found_in_database, and each *.send_paranoid_instructions answers both kinds of address.

en:
  devise:
    confirmations:
      confirmed: "Confirmed your email address. Sign in to continue."
      send_instructions: "Sent a confirmation link to your email address. It arrives in a few minutes."
      send_paranoid_instructions: "If that address has an account here, a confirmation link is on its way to it."
    failure:
      already_authenticated: "You are already signed in."
      inactive: "This account is not active yet."
      invalid: "That email and password do not match an account here."
      locked: "This account is locked for now. Try again in an hour, or ask an administrator to set a new password for it under Settings → Users."
      last_attempt: "That email and password do not match an account here."
      not_found_in_database: "That email and password do not match an account here."
      timeout: "Your session expired. Sign in again to continue."
      unauthenticated: "Sign in to continue."
      unconfirmed: "Confirm your email address first: follow the link in the confirmation email."
    mailer:
      confirmation_instructions:
        subject: "Confirm your email address"
      reset_password_instructions:
        subject: "Reset your password"
      unlock_instructions:
        subject: "Unlock your account"
      email_changed:
        subject: "Your email address changed"
      password_change:
        subject: "Your password changed"
    omniauth_callbacks:
      failure: "Could not sign you in with %{kind}: %{reason}."
      success: "Signed in with %{kind}."
    passwords:
      no_token: "That page opens only from the link in a password reset email. Open the whole link from the email."
      send_instructions: "Sent a password reset link to your email address. It arrives in a few minutes."
      send_paranoid_instructions: "If that address has an account here, a password reset link is on its way to it."
      updated: "Changed your password. You are signed in."
      updated_not_active: "Changed your password."
    registrations:
      destroyed: "Deleted your account and everything in it."
      signed_up: "Created your account."
      signed_up_but_inactive: "Created your account. It is not active yet, so you cannot sign in."
      signed_up_but_locked: "Created your account. It is locked, so you cannot sign in yet."
      signed_up_but_unconfirmed: "Created your account. A confirmation link has been sent to your email address: follow it, then sign in."
      update_needs_confirmation: "Saved your account. Confirm your new email address with the link just sent to it; until then you sign in with the old one."
      updated: "Saved your account."
      updated_but_not_signed_in: "Saved your account. Your password changed, so sign in again with the new one."
    sessions:
      signed_in: "Signed in."
      signed_out: "Signed out."
      already_signed_out: "Signed out."
    unlocks:
      send_instructions: "Sent an unlock link to your email address. It arrives in a few minutes."
      send_paranoid_instructions: "If that address has an account here, an unlock link is on its way to it."
      unlocked: "Unlocked your account. Sign in to continue."
  errors:
    messages:
      already_confirmed: "is already confirmed; sign in"
      confirmation_period_expired: "needs to be confirmed within %{period}; ask for a new link"
      expired: "has expired; ask for a new one"
      not_found: "not found"
      not_locked: "was not locked"
      not_saved:
        one: "1 error prohibited this %{resource} from being saved:"
        other: "%{count} errors prohibited this %{resource} from being saved:"
