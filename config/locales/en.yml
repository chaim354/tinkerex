# Rails' i18n locale file. The app's copy is English literals in the views (CLAUDE.md §14d: no
# externalised strings, and none planned); this file exists so I18n has a non-empty `en` tree —
# an empty one is `nil` to the backend. The scaffold's `hello: "Hello world"` lived here until
# 2026-10-13.
en:
  app_name: "Tinkerex"
