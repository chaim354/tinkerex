# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  # Reconcile share-backed libraries with what's actually on disk. Changes made outside the app
  # (someone drops files on the NAS in Finder) surface within this interval — inotify does not
  # reliably fire for other machines' writes over SMB/NFS, so polling is the honest mechanism
  # (spec decision 5). No-ops unless LIBRARY_BACKEND=share, so it is inert in a chunk deployment.
  #
  # `command:` rather than `class:` because this fans out one ScanJob PER USER (scan_all!) — the
  # other entries here are all-users sweeps that a single job can do. The fanned-out jobs run on
  # the background queue via ScanJob.queue_as.
  library_scan:
    command: "Library::ScanJob.scan_all!"
    schedule: every 15 minutes

  # Reclaim space from FileLayer::Share#delete, which renames into .trash/<node_id>/<name> rather
  # than unlinking — so without this a share library grows forever and the user's delete never
  # actually lands. LIBRARY_TRASH_DAYS (default 30) is the undo window; 0 means keep forever.
  # No-ops unless LIBRARY_BACKEND=share, so it is inert in a chunk deployment.
  #
  # `command:` rather than `class:`, matching library_scan, because the backend gate lives in a
  # class method rather than in #perform (a caller who names a root deserves the operation). Daily
  # and off-peak: the window is measured in DAYS, so nothing is gained by sweeping more often, and
  # an hour apart from version_retention keeps the two off each other's I/O.
  library_trash_purge:
    command: "Library::TrashPurgeJob.purge_all!"
    schedule: every day at 3am

  # Previews whose NODE no longer exists — the orphan class the (user, node, kind) unique index
  # cannot reach. That index removed the other one by construction (a save repoints the single row
  # rather than minting a second), but a dead node's row is the ONLY row for its node, so there is
  # no duplicate group to collapse and nothing else sweeps it: 93 on the share library and 3 on
  # chunk right after the collapse migration.
  #
  # WEEKLY because the reaper's own grace window is measured in DAYS (30 by default, protecting a
  # tombstone that can still be undone) — running it more often reclaims nothing sooner. Unlike
  # orphan_chunk_reaper the cadence is NOT about request billing; this one is DB-only. Backend-
  # neutral, so no `command:` gate: a dead node's preview is dead on all three.
  dead_node_preview_reaper:
    class: Maker::DeadNodeReaperJob
    queue: background
    schedule: every saturday at 5am

  # Project/model file ATTACHMENTS (and chosen project/model covers) pointing at a node the library
  # no longer has. The scan tombstones a deleted file rather than destroying it, so no `dependent:`
  # callback fires and nothing else was sweeping these — a file deleted on the NAS stayed in every
  # project it was attached to, as an "unavailable" tile, forever.
  #
  # DAILY, WHERE dead_node_preview_reaper ABOVE IS WEEKLY, and not by inheritance: both are DB-only
  # and both wait out the same 30-day grace, so cadence buys neither cost nor timeliness against the
  # window. The difference is what a late sweep leaves visible — a stale preview row renders
  # nowhere, a stale attachment is a row the user can see. Five queries per user since S4-8 added links (measured), so daily is cheap.
  #
  # Backend-neutral (no `command:` gate): a dead node is dead on all three backends.
  #
  # Since stage 4, S4-8 it also sweeps `maker_file_links`, whose two node columns can each go dead
  # independently.
  dead_node_attachment_reaper:
    class: Maker::AttachmentReaperJob
    queue: background
    schedule: every day at 5am

  # Auto-create a project for every folder directly under the library's Projects/ that no project
  # claims. CHUNK DEPLOYMENTS ONLY — sweep_all! declines when the backend is `scannable`, because on
  # share/s3 Library::ScanJob calls discovery at the start of its own post-reconcile sequence,
  # strictly BEFORE the project intake. A second caller there would adopt folders the reconcile has
  # not settled yet.
  #
  # `command:` rather than `class:`, matching every other gated entry here, because the backend gate
  # lives in a class method rather than in #perform — a caller who names a user deserves the
  # operation.
  #
  # EVERY 15 MINUTES, matching its two siblings — and arbitrary for the same reason
  # project_folder_intake states below: on chunk_remote there is no poll behind it, so this interval
  # is the ONLY latency bound discovery gets. It is not a floor inherited from anything.
  #
  # A RUN THAT CREATES SOMETHING CHAINS Maker::ProjectIntakeJob rather than waiting for the next
  # project_folder_intake tick, so a newly adopted folder's files are filed seconds later instead of
  # up to fifteen minutes later. See ProjectDiscoveryJob#chain_intake for why that chain is gated
  # off scannable backends.
  project_discovery:
    command: "Maker::ProjectDiscoveryJob.sweep_all!"
    schedule: every 15 minutes

  # Project-folder intake: attach what is under each Projects/<slug>/ folder, file what is loose at
  # its root. CHUNK DEPLOYMENTS ONLY — sweep_all! declines when the backend is `scannable`, because
  # on share/s3 Library::ScanJob already calls the intake at the end of its own perform, strictly
  # after the reconcile. A second caller there would reintroduce the scan overlap that placement
  # exists to prevent (a move made after the Scanner captured its observations is paired back by
  # content hash, leaving the node pointed at a path with no bytes until the next scan).
  #
  # `command:` rather than `class:`, matching library_scan, because the backend gate lives in a
  # class method rather than in #perform — a caller who names a user deserves the operation.
  #
  # EVERY 15 MINUTES, MATCHING library_scan — BUT NOT FOR THE REASON AN EARLIER VERSION OF THIS
  # COMMENT GAVE. It used to say the shared number gives "both deployments the same worst-case
  # lateness", which treats the two 15-minute figures as the same kind of constraint, and they are
  # not — the same "two things that happen to share a value today" trap FileLayer::Capabilities'
  # scannable/port_writable commentary warns against, made here instead of merely described. On
  # share/s3, 15 minutes is a genuine FLOOR: Library::ScanJob cannot discover a change any faster
  # than its own poll, so this job riding the same interval costs nothing extra. On chunk_remote
  # there is no such floor — the mirror's own freshness is remote_changelog_pull's 2 minutes, well
  # inside this — so 15 minutes here is an arbitrary choice, not an inherited limit.
  #
  # WHAT THIS SCHEDULE IS: THE CORRECTNESS BACKSTOP, NOT THE ONLY LATENCY BOUND. Three fast paths
  # now sit in front of it, and they are different mechanisms rather than one repeated:
  #
  #   - THE EAGER PER-UPLOAD NUDGE calls Maker::ProjectIntake.for_node INLINE, through
  #     ProjectFolderIntake#intake_project_folder. Four call sites: the three web upload doors
  #     (FilesController#create, FilesController#finalize_upload, Projects::UploadsController#
  #     create) and the addon save (Tools::AddonsController, via Tools::BaseController's include),
  #     which can write into a project's folder (it starts where the tool last saved, mapped up to
  #     that project's folder) and needed the same treatment.
  #
  #   - A DEVICE PUSH is covered by FileLayer::ChunkRemote::ChangelogSync#nudge_project_intake,
  #     which runs after that pull's apply loop and hands the parents of the live files it just
  #     applied to Maker::ProjectIntakeJob.nudge_parents. The bound is remote_changelog_pull's
  #     2-minute interval plus ProjectIntakeJob::NUDGE_DELAY (30s) — about two and a half minutes,
  #     not fifteen. THIS PARAGRAPH USED TO SAY A DEVICE PUSH HAD "NO FAST PATH AT ALL" and blamed
  #     the absence on Sync::Commit#finalize. That engine left this repo in Arc D Part 2 (§12.12)
  #     and `Sync::` has been undefined in this process since, so the text outlived both halves of
  #     its own premise: the door it named no longer exists, and the gap it described is closed
  #     (CLAUDE.md §12 item 10, CLOSED).
  #
  #   - THE INTERACTIVE SCAN DOORS, on a user's command. Projects::ScansController#create (the
  #     per-project button) files SYNCHRONOUSLY via Maker::ProjectIntake.for_project on
  #     chunk_remote and, on share/s3, enqueues Library::ScanJob and files nothing itself — the
  #     asymmetry is a rule, not an inconsistency (docs/invariants/project-intake.md). The Files
  #     page's FilesController#rescan is require_scannable!-gated, so it reaches only the second
  #     half, where ScanJob#perform runs the intake inline after the reconcile.
  #
  # NONE OF THAT RETIRES THIS SWEEP, AND THE NUDGE'S OWN NARROWNESS IS WHY. It fires for LIVE FILE
  # ARRIVALS ONLY, so a file already in the mirror but still unfiled — left by an earlier
  # collision, or sitting in a folder discovery has just adopted — gets no nudge at all. That is
  # the case the scan button's chunk_remote branch exists for, and the case this schedule catches
  # unattended.
  #
  # THE NUDGE IS STILL NOT PER-COMMIT, AND THAT COST ARGUMENT IS WHY THE FAST PATH SITS WHERE IT
  # DOES rather than at the write. A per-file trigger would turn a device syncing 500 files into
  # 500 synchronous full-project sweeps — the cost measured on .for_node (2,425 queries / ~390ms
  # for a 200-file backlog), multiplied by every file in the batch. ChangelogSync therefore asks
  # ONCE for a whole catch-up, after the loop rather than inside it, and `full_resync` DELIBERATELY
  # does not feed it at all: a resync re-applies the entire tree, so every file in the library
  # would read as an arrival. What those exclusions leave behind — a resynced tree, a nudge that
  # failed to enqueue (nudge_parents is best-effort and swallows) — is this sweep's job.
  project_folder_intake:
    command: "Maker::ProjectIntakeJob.sweep_all!"
    schedule: every 15 minutes

  # Model catalog: every model-role file in the library belongs to a model, decided by the nearest
  # shelf above it. CHUNK DEPLOYMENTS ONLY -- sweep_all! declines when the backend is `scannable`,
  # because on share/s3 Library::ScanJob calls the intake at the end of its own perform, strictly
  # after the reconcile AND after discovery and the project intake (a file this app is about to
  # move has no business being catalogued at its old path; ScanJob#intake_models says where that
  # still changes the answer).
  #
  # HERE NOTHING ORDERS THIS ENTRY against project_discovery or project_folder_intake, and for a
  # folder under `Projects/` it does not need to (F-S07-1, 2026-10-19): the catalog counts every
  # folder discovery owns BY POSITION as claimed, adopted yet or not (Maker::ModelIntake
  # .claimed_folders), so a folder another device pushes there is never one model, whichever of the
  # three ticks first or wherever the 2-minute pull lands between them. What the intake-before-
  # catalog order still decides elsewhere (a project adopted at a top-level folder with filing on)
  # is not sequenced on this backend either.
  #
  # `command:` rather than `class:`, matching every other gated entry here, because the backend gate
  # lives in a class method rather than in #perform.
  #
  # EVERY 15 MINUTES, matching project_folder_intake -- and arbitrary for the same reason it is
  # arbitrary there: no poll sits behind it on chunk_remote. THE TWO ENTRIES DIVERGE PAST THAT
  # POINT, so this one states its own answer rather than inheriting the neighbour's. Here the
  # interval really IS the only latency bound the catalog gets, and that survived a check: there is
  # no eager model-intake nudge at any web door (Maker::ModelIntake::MAX_MODELS' "nothing in a web
  # request sweeps" is exactly why it carries ONE cap where Maker::ProjectIntake carries two);
  # ChangelogSync#nudge_project_intake nudges the PROJECT intake only; and
  # Projects::ScansController's chunk_remote branch (#pull_and_file) calls
  # Maker::ProjectIntake.for_project and stops there. A device push and a scan button both
  # accelerate FILING on this backend, neither accelerates CATALOGUING. So an upload's model still
  # appears within a tick -- the accepted trade; see docs/invariants/model-intake.md for why there
  # is no eager nudge.
  #
  # ON SHARE/S3 -- WHERE THIS SCHEDULE DECLINES -- THE CATALOG HAS TWO ON-DEMAND TRIGGERS, named
  # here so "nothing in a web request sweeps" is not read as a repo-wide claim it no longer
  # supports. FilesController#rescan (require_scannable!-gated, so it refuses on chunk_remote) and
  # Projects::ScansController#create both reach Library::ScanJob.enqueue_for, and #perform runs
  # intake_models inline at the end of its sequence -- a user can catalogue on demand there instead
  # of waiting out library_scan. Both ENQUEUE rather than sweeping in-request, so MAX_MODELS'
  # one-cap argument is untouched; what changes is the LATENCY claim alone, and only on the
  # backends this entry has already declined.
  model_catalog_intake:
    command: "Maker::ModelIntakeJob.sweep_all!"
    schedule: every 15 minutes

  # Arc B gap (a): FileLayer::ChunkRemote::ChangelogSync had exactly one caller, #refresh!, itself
  # reached only from THIS app's own writes (mkdir/move/delete/undelete/finalize_upload,
  # chunk_remote.rb). A node another device pushed straight to the sync server was invisible to the
  # maker UI indefinitely — GET /files never refreshed the mirror as a side effect of a plain read.
  # This is the scheduled, per-user backstop: pull whatever changed on the server since our cursor,
  # whether or not this app was the one that changed it.
  #
  # `command:` not `class:`, matching library_scan/project_folder_intake above — Solid Queue
  # resolves a `class:` at load and reads ONE file with no merge mechanism, so the backend gate has
  # to live in a class method (FileLayer::RemoteChangelogPullJob.pull_all!) rather than here.
  #
  # EVERY 2 MINUTES, DELIBERATELY SHORTER THAN library_scan's 15. That 15-minute figure is set by
  # an EXPENSIVE NAS walk (or an S3 list); a changelog pull that finds nothing is ONE GET per user
  # in the common case — a single PAGE-sized /v1/changes whose body carries the delta AND the
  # `oldest_seq`/`head_seq` the pruned-gap check reads, so an empty page ends the pull with no
  # second request. (It was TWO until the probe was folded in: a separate `limit: 1` GET asked for
  # the gap fields the page was about to carry anyway. changelog_sync_test now pins the count at
  # exactly one.) Nothing here is billed per request the way S3 listing is, so there is no cost
  # argument for spacing it out further — 2 minutes gives a meaningfully fresher mirror than
  # share/s3 get from their own poll, at negligible cost.
  #
  # THIS IS STILL A POLL, NOT THE LATENCY FIX. The real answer is a sync -> maker webhook, or a
  # subscription to the SYNC SERVER's own broadcast — out of scope for this arc.
  #
  # THAT SENTENCE USED TO NAME A PRECEDENT THAT NO LONGER EXISTS, and it is corrected rather than
  # deleted because the dead half is the part a reader would act on: it said an ActionCable
  # subscription would match "what LibraryChannel already gives the embedded `chunk` backend
  # today". Embedded chunk was retired 2026-08-25 (§12.12) and THIS APP HAS NO CHANNEL AT ALL —
  # no `app/channels/`, no `LibraryChannel` constant, §14e says it outright, and
  # test/cable_absent_test.rb pins it. So there is no in-repo precedent to match; the broadcast a
  # device already gets belongs to tinkerex-sync, which is where that work would land.
  #
  # This job trades unbounded staleness for staleness bounded at ~2 minutes, the same kind of trade
  # Library::ScanJob already makes for share/s3.
  remote_changelog_pull:
    command: "FileLayer::RemoteChangelogPullJob.pull_all!"
    schedule: every 2 minutes

  # The public demo's nightly reset: the demo account's library is wiped and re-seeded from
  # db/seeds/demo (Tinkerex::DemoReset). A NO-OP UNLESS DEMO_ACCOUNT_EMAIL IS SET, and it names an
  # account `bin/rails tinkerex:demo:setup` created — so it is inert on every deployment but the
  # demo's. On a share/s3 library another account shares it refuses, logs why, and changes nothing.
  #
  # `class:` rather than `command:`: the gate lives in #perform, which reads the one setting, so there
  # is no class-method fan-out to call. UTC SPELLED OUT, because the banner a visitor reads promises
  # 04:00 UTC and an unzoned schedule follows the server's local zone.
  demo_reset:
    class: Tinkerex::DemoResetJob
    queue: background
    schedule: every day at 4am UTC
