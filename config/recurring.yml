# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Version retention + chunk GC. Applies RETENTION_POLICY across all users (defaults to
  # keep_all → no-op on self-host; set RETENTION_POLICY=tiered for managed thinning), then
  # sweeps refcount-0 chunks from the DB + object storage. Runs nightly, off-peak.
  version_retention:
    class: RetentionJob
    queue: background
    schedule: every day at 4am

  # Storage-orphan chunk reaper (G4). Lists the object-storage keyspace and deletes chunk
  # bytes left by commits that uploaded but never finalized — objects with NO DB row, which
  # the refcount-based version_retention sweep cannot see. Runs on a CONSERVATIVE weekly
  # cadence because list_objects_v2 is billed per request on S3/R2; the grace window inside
  # the reaper (24h default) protects in-flight uploads, so weekly is plenty timely for a
  # cost leak. Off-peak, on a different day/hour from version_retention.
  orphan_chunk_reaper:
    class: ChunkReaperJob
    queue: background
    schedule: every sunday at 5am
