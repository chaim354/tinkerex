# Tinkerex with the Tools gallery: four containers, and THE FOLDER THIS FILE IS IN is the library.
# Put the file in the folder that holds your files, or in an empty one, and in that folder:
#
#   docker compose up -d                           pull and start; then http://localhost:8080
#   docker compose pull && docker compose up -d    update
#
# Whatever folder the file is in becomes the library, with a .trash/ inside it, so not Downloads.
# Overrides go in an optional .env beside this file: LIBRARY_HOST_PATH to keep the file here and the
# library elsewhere, PUID/PGID to run as someone other than the folder's owner, TINKEREX_PORT, and
# the accounts/mail knobs (.env.example lists them; docs/INSTALL.md explains them).
# docker-compose.build.yml rebuilds all four images from a clone instead of pulling them;
# docker-compose.chunk_remote.yml adds the sync server (INSTALL.md section 5).

services:
  web:
    image: ${TINKEREX_IMAGE:-ghcr.io/chaim354/tinkerex:latest}
    ports:
      - "${TINKEREX_PORT:-8080}:80"
    env_file:
      - path: .env
        required: false
    environment:
      # The user the app runs as inside the container. Unset, the entrypoint uses the library
      # folder's owner (so a folder that is yours, or an Unraid share, needs nothing); set them to
      # run as someone else. Docker Desktop (Mac, Windows) needs nothing either way.
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      # Display only, never a path the app opens. Its one reader (LibraryFolderHelper) turns this into "the folder your
      # docker-compose.yml is in" when empty, or the path as typed.
      LIBRARY_HOST_PATH: ${LIBRARY_HOST_PATH:-}
      # Puma's stock 3 threads starve once a tool call is proxied through the app; 16 is what the
      # author runs.
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS:-16}
      # The Tools gallery, wired to the three services below.
      BOXES_SIDECAR_URL: http://boxes:8000
      OPENSCAD_SIDECAR_URL: http://openscad:8000
      ADDON_SOURCE_URL: http://addons
    volumes:
      - tinkerex_storage:/rails/storage
      - ${LIBRARY_HOST_PATH:-.}:/library
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    restart: unless-stopped

  # The Tools gallery. The two sidecars are GPL-licensed and run as their own processes, reached
  # over HTTP and never linked into the app (CLAUDE.md section 9); addons serves the bundle files.
  # ALL THREE ARE PINNED TO linux/amd64: openscad is an x86-only AppImage, and the other two are
  # published for amd64 alone today (measured 2026-10-14 with docker buildx imagetools inspect). The
  # pin makes an arm64 Docker Desktop pull and emulate them instead of failing with "no matching
  # manifest". An arm64 Linux box without emulation loses the three Tools services and keeps the
  # app; the gallery then says so.
  boxes:
    image: ghcr.io/chaim354/boxes-sidecar:latest
    platform: linux/amd64
    restart: unless-stopped
  openscad:
    image: ghcr.io/chaim354/openscad-sidecar:latest
    platform: linux/amd64
    volumes:
      - openscad_cache:/cache
    restart: unless-stopped
  addons:
    image: ghcr.io/chaim354/tinkerex-addons:latest
    platform: linux/amd64
    restart: unless-stopped

volumes:
  tinkerex_storage: {}
  openscad_cache: {}
