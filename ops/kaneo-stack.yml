# The Kaneo stack, deployed as the Dockhand stack `kaneo` on the Unraid box.
# Kaneo holds the canonical work record — CLAUDE.md §11.
#
# DOCKHAND, NOT PORTAINER, SINCE 2026-11-24. Dockhand (fnsys/dockhand) answers at
# http://dockhand.home and http://192.168.1.146:3000, environment id 1. Portainer managed this stack
# until then and is gone from the box; portainer.home now points at dockhand.home. The stack was
# adopted in place with no restart; the file it moved with differed from this one only in comments.
#
# TWO HOSTS, AND CONFUSING THEM COSTS AN AFTERNOON. Nginx Proxy Manager is 192.168.1.7, where the
# `*.home` wildcard resolves — every .home name on this LAN answers from there, INCLUDING
# dockhand.home. Docker runs on 192.168.1.146 ("Tower", the Unraid host itself). So this stack's
# containers listen on .146, and NPM's proxy host for kaneo.home forwards to 192.168.1.146:5173.
# Probing .7:5173 after a deploy looks exactly like a stack that failed to start; it is just the
# wrong box.
#
# THIS FILE IS NOT EXECUTED BY ANYTHING IN THIS REPO. The running copy is
# /mnt/user/appdata/dockhand/stacks/kaneo/docker-compose.yml on the box, which Dockhand reads from
# disk on EVERY deploy; this is the reviewable one. Edit here, then copy it over and deploy:
#
#   scp ops/kaneo-stack.yml root@192.168.1.146:/mnt/user/appdata/dockhand/stacks/kaneo/docker-compose.yml
#   curl -X POST -H 'Content-Type: application/json' -d '{"pull":false}' \
#     'http://192.168.1.146:3000/api/stacks/kaneo/deploy?env=1'
#
# The deploy answers with Server-Sent Events. Read the outcome back from
# `GET /api/stacks/kaneo/deploys?env=1` and `.../deploys/<id>/log`; the Dockhand UI does the same
# job. A DEPLOY RECREATES THE CONTAINERS, and the first Dockhand deploy of this adopted stack always
# does, because the compose working directory moved — Kaneo, and so bin/log, is down for the
# restart. THE PROJECT NAME MUST STAY `kaneo`: the running containers carry
# com.docker.compose.project=kaneo and the database is the named volume `kaneo_kaneo_postgres_data`
# (both measured 2026-11-24). Under any other project name Compose creates a fresh, EMPTY volume and
# Kaneo boots with no record in it. If Dockhand auth is turned on, these calls need a bearer token, and that token never goes
# in a tracked file (§14g).
#
# When you change the running stack, change this file in the same breath. A committed file that has
# silently diverged from what runs is §15's "a doc row that names a commit is a claim" problem one
# layer down: it reads as the truth and nothing can go red for it.
#
# THE TWO SECRETS LIVE IN A `.env` BESIDE THE COMPOSE FILE ON THE BOX, not in this file —
# /mnt/user/appdata/dockhand/stacks/kaneo/.env holds POSTGRES_PASSWORD and AUTH_SECRET, which
# Compose interpolates into the ${...} below. Never print, copy or commit its values; the scp above
# replaces docker-compose.yml only and leaves the .env alone. They also live in 1Password (§14g);
# nothing here is `export`ed. (They were Portainer stack environment variables until 2026-11-24.)
#
# FOUR DELIBERATE DEPARTURES FROM UPSTREAM'S compose.yml — do not "restore" them:
#
#   1. THE IMAGE IS PINNED. Upstream uses `:latest`. A floating tag on the box holding the canonical
#      record upgrades it without anyone deciding to, and the first anyone would know is a changed
#      API shape under bin/log.
#   2. POSTGRES PUBLISHES NO PORT. Upstream publishes 5432. Nothing off-box needs it; the kaneo
#      container reaches it on the stack network by service name.
#   3. NO MINIO. Object storage is optional upstream and powers only image uploads inside task
#      descriptions and comments. The record is ~1 MB of markdown with no images, so the service is
#      omitted rather than configured.
#   4. POSTGRES CARRIES NO env_file. Upstream shares one .env across both services; naming the three
#      POSTGRES_* values explicitly is what stops a later edit from handing the database a variable
#      it silently ignores while the app keeps using the old one.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kaneo
      POSTGRES_USER: kaneo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - kaneo_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaneo -d kaneo"]
      interval: 10s
      timeout: 5s
      retries: 5

  kaneo:
    image: ghcr.io/usekaneo/kaneo:2.18.0
    ports:
      - "5173:5173"
    environment:
      KANEO_CLIENT_URL: http://kaneo.home
      DATABASE_URL: postgresql://kaneo:${POSTGRES_PASSWORD}@postgres:5432/kaneo
      POSTGRES_DB: kaneo
      POSTGRES_USER: kaneo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_SECRET: ${AUTH_SECRET}
      # BOTH ARE "true" NOW AND MUST STAY THAT WAY. They were "false" for exactly one signup, because
      # the instance admin is whoever signs up FIRST — GET /api/instance/status reports
      # hasUsers:false until then. Setting them to "true" BEFORE claiming the account locks you out
      # of your own instance; leaving them "false" AFTER lets anyone on the LAN create an account on
      # the box holding the canonical record (CLAUDE.md §11).
      #
      # A REBUILD FROM AN EMPTY VOLUME NEEDS THEM "false" AGAIN, briefly. That is the only reason to
      # touch these, and the account must be claimed before the same edit is undone. Verify with
      # GET /api/config, which reports disableRegistration and hasGuestAccess — read it rather than
      # assuming the redeploy took the env change.
      DISABLE_REGISTRATION: "true"
      DISABLE_GUEST_ACCESS: "true"
      # KANEO_API_URL IS DELIBERATELY UNSET. It defaults to KANEO_CLIENT_URL/api, which is what this
      # deployment wants: NPM proxies kaneo.home to this container whole, path included, so the
      # browser stays on one origin and the container proxies /api internally. Setting it explicitly
      # is only for a proxy that rewrites the path, which this one does not.
      #
      # TRUSTED_PROXIES IS ALSO UNSET, AND THAT IS CORRECT RATHER THAN FORGOTTEN. Its default already
      # covers 192.168.0.0/16, which is where NPM sits. Listing a range clients can reach Kaneo from
      # directly would let them forge X-Forwarded-For, which feeds rate limiting and session records.
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  kaneo_postgres_data:
