<!doctype html>
<html lang="en">
  <head>
    <title>Something went wrong — Tinkerex</title>
    <meta charset="utf-8">
    <meta name="viewport" content="initial-scale=1, width=device-width">
    <meta name="robots" content="noindex, nofollow">
    <style>
      :root { color-scheme: light dark; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #ffffff; color: #0f1113; }
      main { max-width: 32rem; padding: 2rem 1rem; }
      .brand { font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; color: #555b63; margin: 0 0 1rem; }
      h1 { font-size: 1.5rem; margin: 0 0 .5rem; }
      p { margin: 0 0 1rem; line-height: 1.5; }
      a { color: inherit; }
      @media (prefers-color-scheme: dark) { body { background: #111316; color: #e6e8eb; } .brand { color: #9ba2ab; } }
    </style>
  </head>
  <body>
    <main>
      <p class="brand">Tinkerex</p>
      <h1>Something went wrong on the server.</h1>
      <p>Nothing you did caused this. Try again in a moment; if it keeps happening, whoever runs this server will find the details in the web container's log.</p>
      <p><a href="/">Back to the library</a></p>
    </main>
  </body>
</html>
